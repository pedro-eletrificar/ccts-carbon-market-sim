<meta charset="utf-8">
<title>CCTS Carbon Market Simulator</title>
<style>
  :root {
    color-scheme: light;
    --page: #f5f9ff;
    --surface: #ffffff;
    --surface-2: #f1fbff;
    --ink: #0a0e1a;
    --ink-2: #3d4552;

    --grid: #dce7f5;
    --baseline: #b9cbe8;
    --border: rgba(0,51,204,0.14);
    --accent: #0033cc;
    --accent-ink: #ffffff;

      --baseline: #2f4270;
      --border: rgba(255,255,255,0.14);

  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #070b18;
    --surface: #0f1830;
    --surface-2: #16264d;
    --ink: #ffffff;
    --ink-2: #c7d4ec;

    text-align: left;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 0.9rem 1rem;
    cursor: pointer;
    color: var(--ink);

  .arche-tile:hover { border-color: var(--accent); }
  .arche-tile.selected { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .arche-tile .at-name { font-weight: 700; font-family: var(--display); }

  .kpi { display: flex; flex-direction: column; gap: 0.15rem; }

  .pill {

  .measure-row .m-name { font-weight: 600; font-size: 13.5px; }
  .measure-row .m-meta { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }

  .seat-row {
    display: flex; align-items: center; justify-content: space-between;

  .seat-row .s-sector { font-weight: 700; font-family: var(--display); font-size: 14px; }
  .seat-row .s-who { font-size: 12.5px; color: var(--ink-2); }

  .code-display {
    font-family: var(--mono); font-weight: 700; font-size: 2.4rem; letter-spacing: 0.18em;
    text-align: center; padding: 0.9rem; border-radius: 10px;
    background: var(--surface-2); border: 1px solid var(--border); color: var(--accent);
  }

  input[type="range"] { width: 100%; accent-color: var(--accent); }
  input[type="number"] {
    font-family: var(--mono); font-variant-numeric: tabular-nums;
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px;
    color: var(--ink); padding: 0.45rem 0.6rem; width: 100%; font-size: 14px;
  }
  label.field { display: flex; flex-direction: column; gap: 0.3rem; font-size: 12px; color: var(--ink-2); text-transform: uppercase; letter-spacing: 0.05em; }

  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: left; padding: 0.5rem 0.6rem; border-bottom: 1px solid var(--grid); }
  th { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 600; }
  td.num, th.num { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
  tr.you td { background: color-mix(in srgb, var(--accent) 7%, transparent); }
  .table-wrap { overflow-x: auto; }

  .divider { height: 1px; background: var(--grid); border: none; margin: 0.25rem 0; }
  .muted { color: var(--muted); font-size: 12.5px; }
  .foot-note { font-size: 11.5px; color: var(--muted); border-top: 1px solid var(--grid); padding-top: 0.75rem; margin-top: 0.5rem; }

  .steps { display: flex; gap: 0.4rem; margin-bottom: 1.25rem; flex-wrap: wrap; }
  .step {
    font-family: var(--mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em;
    padding: 0.3rem 0.6rem; border-radius: 5px; color: var(--muted); background: var(--surface-2); border: 1px solid var(--border);
  }
  .step.on { color: var(--accent-ink); background: var(--accent); border-color: var(--accent); }
  .step.done { color: var(--good); border-color: var(--good); background: transparent; }

  svg text { font-family: var(--mono); fill: var(--ink-2); }
  .chart-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 1.1rem 1.2rem; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

<div id="app"></div>

<script src="engine.js"></script>
<script>
(function () {
  "use strict";

  /* ---------- formatters (SECTORS/ARCHETYPES/engine functions now come from engine.js) ---------- */

  var money = new Intl.NumberFormat("en-IN", { maximumFractionDigits: 2 });
  var moneyInt = new Intl.NumberFormat("en-IN", { maximumFractionDigits: 0 });
  var num2 = new Intl.NumberFormat("en-IN", { maximumFractionDigits: 2 });

  function cr(v) { return "₹" + money.format(v / 1e7) + " Cr"; }
  function rupee(v) { return "₹" + moneyInt.format(Math.round(v)); }
  function pct(v) { return num2.format(v) + "%"; }

  /* ---------- batch / Monte Carlo simulator ---------- */

  function runSimTrial(cfg) {
    var firms = [];
    SECTORS.forEach(function (sector) {
      for (var i = 0; i < cfg.firmsPerSector; i++) {
        var archetype = weightedPick(ARCHETYPES, cfg.archetypeWeights);
        var strategy = weightedPick(BOT_STRATEGIES, cfg.strategyWeights);
        firms.push(generateCompany(sector, archetype, false, strategy, cfg.variance, sector.id + "-" + i));
      }
    });

    var priceHistory = [];
    var yearMetrics = [];

    for (var year = 1; year <= 2; year++) {
      var priceGuess = priceHistory.length ? priceHistory[priceHistory.length - 1] : (PRICE_FLOOR + PRICE_CEIL) / 2;
      var abate = {};
      firms.forEach(function (c) {
        var sector = sectorById(c.sectorId);
        var newCount = botChooseAbatement(c, sector, year, priceGuess);
        var target = targetIntensity(c, sector, year);
        var reduced = cumulativeReduction(c, newCount);
        var actualIntensity = c.baselineIntensity - reduced;
        var emissions = actualIntensity * c.output;
        var allowance = target * c.output;
        c.activatedCount = newCount;
        abate[c.id] = { actualIntensity: actualIntensity, target: target, emissions: emissions, allowance: allowance, surplusDeficit: allowance - emissions };
      });

      var orders = [];
      firms.forEach(function (c) {
        var sd = abate[c.id].surplusDeficit;
        var o = botChooseOrder(c, sd, priceGuess);
        if (o && o.qty > 0.5) orders.push({ companyId: c.id, side: o.side, qty: o.qty, limitPrice: o.limitPrice });
      });
      var auction = clearAuction(orders, priceGuess);
      priceHistory.push(auction.clearingPrice);

      var m = {
        year: year, price: auction.clearingPrice,
        requiredAbatement: 0, actualAbatement: 0,
        coveredByBank: 0, coveredByMarket: 0, penalizedTonnes: 0,
        compliantCount: 0, firmCount: firms.length,
        sectorStats: {}
      };
      SECTORS.forEach(function (s) { m.sectorStats[s.id] = { compliant: 0, total: 0, actualCut: 0, requiredCut: 0 }; });

      firms.forEach(function (c) {
        var ab = abate[c.id];
        var sd = ab.surplusDeficit;
        var filled = auction.fills[c.id] || 0;
        var bankUsed = 0, bought = 0, sold = 0, penaltyTonnes = 0, bankedNow = 0;
        if (sd >= 0) {
          sold = filled;
          bankedNow = sd - filled;
          c.bank += bankedNow;
        } else {
          var shortfall = -sd;
          bankUsed = Math.min(c.bank, shortfall);
          c.bank -= bankUsed;
          var remaining = shortfall - bankUsed;
          bought = Math.min(filled, remaining);
          var stillShort = remaining - bought;
          if (stillShort > 0.01) penaltyTonnes = stillShort;
        }
        var req = (c.baselineIntensity - ab.target) * c.output;
        var act = cumulativeReduction(c, c.activatedCount) * c.output;
        m.requiredAbatement += req;
        m.actualAbatement += act;
        m.coveredByBank += bankUsed;
        m.coveredByMarket += bought;
        m.penalizedTonnes += penaltyTonnes;
        var compliant = penaltyTonnes <= 0.01;
        if (compliant) m.compliantCount++;
        var ss = m.sectorStats[c.sectorId];
        ss.total++; if (compliant) ss.compliant++;
        ss.actualCut += act; ss.requiredCut += req;
      });
      yearMetrics.push(m);
    }
    return yearMetrics;
  }

  function runSimulation(cfg) {
    var perYear = [[], []];
    for (var t = 0; t < cfg.trials; t++) {
      var ym = runSimTrial(cfg);
      perYear[0].push(ym[0]);
      perYear[1].push(ym[1]);
    }
    var result = { years: [], trials: cfg.trials };
    perYear.forEach(function (trialsForYear) {
      var prices = trialsForYear.map(function (m) { return m.price; }).sort(function (a, b) { return a - b; });
      var complianceRates = trialsForYear.map(function (m) { return m.compliantCount / m.firmCount * 100; });
      var reqTotal = trialsForYear.reduce(function (s, m) { return s + m.requiredAbatement; }, 0);
      var actTotal = trialsForYear.reduce(function (s, m) { return s + m.actualAbatement; }, 0);
      var bankTotal = trialsForYear.reduce(function (s, m) { return s + m.coveredByBank; }, 0);
      var marketTotal = trialsForYear.reduce(function (s, m) { return s + m.coveredByMarket; }, 0);
      var penaltyTotal = trialsForYear.reduce(function (s, m) { return s + m.penalizedTonnes; }, 0);
      var deficitTotal = bankTotal + marketTotal + penaltyTotal;
      var sectorAgg = {};
      SECTORS.forEach(function (s) { sectorAgg[s.id] = { compliant: 0, total: 0, actualCut: 0, requiredCut: 0 }; });
      trialsForYear.forEach(function (m) {
        SECTORS.forEach(function (s) {
          var ss = m.sectorStats[s.id];
          sectorAgg[s.id].compliant += ss.compliant;
          sectorAgg[s.id].total += ss.total;
          sectorAgg[s.id].actualCut += ss.actualCut;
          sectorAgg[s.id].requiredCut += ss.requiredCut;
        });
      });
      result.years.push({
        year: trialsForYear[0].year,
        priceMedian: percentile(prices, 50), priceP10: percentile(prices, 10), priceP90: percentile(prices, 90),
        complianceMean: complianceRates.reduce(function (s, v) { return s + v; }, 0) / complianceRates.length,
        requiredAbatement: reqTotal / cfg.trials, actualAbatement: actTotal / cfg.trials,
        bankShare: deficitTotal ? bankTotal / deficitTotal * 100 : 0,
        marketShare: deficitTotal ? marketTotal / deficitTotal * 100 : 0,
        penaltyShare: deficitTotal ? penaltyTotal / deficitTotal * 100 : 0,
        sectorAgg: sectorAgg
      });
    });
    return result;
  }

  /* ---------- app state ---------- */

  var G = {
    screen: "landing",
    year: 1,
    companies: [],
    playerId: null,
    priceHistory: [],
    yearData: {},
    draft: { sectorId: null, archetypeId: null },
    abateDraft: 0,
    tradeDraft: { qty: 0, limitPrice: PRICE_FLOOR },
    simConfig: {
      firmsPerSector: 15,
      archetypeWeights: [50, 50, 50],
      strategyWeights: [50, 50, 50, 50],
      varianceLabel: "medium",
      trials: 50
    },
    simResult: null
  };

  var VARIANCE_LEVELS = { low: 0.05, medium: 0.10, high: 0.25 };

  function companyById(id) { return G.companies.filter(function (c) { return c.id === id; })[0]; }
  function player() { return companyById(G.playerId); }

  /* ---------- multiplayer client ---------- */

  var MP = {
    code: null,
    hostToken: null,
    mySeat: null,
    myName: null,
    state: null,
    pollHandle: null,
    entryError: null,
    joinDraft: { code: "", name: "" },
    seatDraft: { seat: null, name: "", archetypeId: "midpack" },
    abateDraft: 0,
    tradeDraft: { qty: 0, limitPrice: PRICE_FLOOR },
    busy: false
  };

  function mpStorageKey(code) { return "cctsMp:" + code; }

  function mpSaveSession() {
    if (!MP.code) return;
    try {
      sessionStorage.setItem(mpStorageKey(MP.code), JSON.stringify({ hostToken: MP.hostToken, mySeat: MP.mySeat, myName: MP.myName }));
      sessionStorage.setItem("cctsMpLast", MP.code);
    } catch (e) { /* storage unavailable — session just won't survive a refresh */ }
  }

  function mpLoadSession(code) {
    try {
      var raw = sessionStorage.getItem(mpStorageKey(code));
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }

  async function mpApi(action, payload) {
    var body = Object.assign({ action: action }, payload || {});
    var res = await fetch("/api/room", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    var data = await res.json().catch(function () { return {}; });
    if (!res.ok) throw new Error(data.error || ("Request failed (" + res.status + ")"));
    return data;
  }

  async function mpFetchState(code) {
    var res = await fetch("/api/room?code=" + encodeURIComponent(code));
    var data = await res.json().catch(function () { return {}; });
    if (!res.ok) throw new Error(data.error || ("Request failed (" + res.status + ")"));
    return data.state;
  }

  function mpStopPolling() {
    if (MP.pollHandle) { clearInterval(MP.pollHandle); MP.pollHandle = null; }
  }

  function mpStartPolling() {
    mpStopPolling();
    MP.pollHandle = setInterval(function () {
      if (!MP.code) return;
      mpFetchState(MP.code).then(function (state) {
        if (!state) return;
        if (!MP.state || state.version !== MP.state.version) {
          MP.state = state;
          if (G.screen === "mp") render();
        }
      }).catch(function () { /* transient network error — next poll retries */ });
    }, 2000);
  }

  function mpReset() {
    mpStopPolling();
    MP.code = null; MP.hostToken = null; MP.mySeat = null; MP.myName = null; MP.state = null; MP.entryError = null;
  }

  function mpMyCompany() {
    return MP.state && MP.mySeat ? MP.state.companies[MP.mySeat] : null;
  }

  async function mpCreateRoom() {
    MP.busy = true; MP.entryError = null; render();
    try {
      var data = await mpApi("create", {});
      MP.code = data.code; MP.hostToken = data.hostToken; MP.state = data.state;
      mpSaveSession();
      mpStartPolling();
    } catch (e) { MP.entryError = e.message; }
    MP.busy = false; render();
  }

  async function mpJoinRoomLookup() {
    var code = (MP.joinDraft.code || "").trim().toUpperCase();
    if (!code) { MP.entryError = "Enter a room code"; render(); return; }
    MP.busy = true; MP.entryError = null; render();
    try {
      var state = await mpFetchState(code);
      MP.code = code; MP.state = state;

  function startGame() {
    var sector = sectorById(G.draft.sectorId);
    var archetype = ARCHETYPES.filter(function (a) { return a.id === G.draft.archetypeId; })[0];
    G.companies = [];
    G.playerId = sector.id;
    G.companies.push(generateCompany(sector, archetype, true, null));
    SECTORS.filter(function (s) { return s.id !== sector.id; }).forEach(function (s, i) {
      var botArche = ARCHETYPES[i % ARCHETYPES.length];
      var strategy = BOT_STRATEGIES[i % BOT_STRATEGIES.length];
      G.companies.push(generateCompany(s, botArche, false, strategy));
    });
    G.year = 1;
    G.priceHistory = [];
    G.yearData = {};
    G.screen = "briefing";
    render();
  }

  function beginAbatement() {
    G.abateDraft = player().activatedCount;
    G.screen = "abatement";
    render();
  }

  function confirmAbatement() {
    var yd = ensureYearData();
    var sector = sectorById(player().sectorId);
    G.companies.forEach(function (c) {
      var s = sectorById(c.sectorId);
      var priceGuess = G.priceHistory.length ? G.priceHistory[G.priceHistory.length - 1].price : (PRICE_FLOOR + PRICE_CEIL) / 2;
      var newCount = c.isPlayer ? clamp(G.abateDraft, c.activatedCount, 4) : botChooseAbatement(c, s, G.year, priceGuess);
      var capex = newMeasuresCost(c, c.activatedCount, newCount);
      var target = targetIntensity(c, s, G.year);
      var reduced = cumulativeReduction(c, newCount);
      var actualIntensity = c.baselineIntensity - reduced;
      var emissions = actualIntensity * c.output;
      var allowance = target * c.output;
      c.activatedCount = newCount;
      yd.abate[c.id] = { capex: capex, actualIntensity: actualIntensity, target: target, emissions: emissions, allowance: allowance, surplusDeficit: allowance - emissions };
    });
    G.screen = "trading";
    var priceGuess2 = G.priceHistory.length ? G.priceHistory[G.priceHistory.length - 1].price : (PRICE_FLOOR + PRICE_CEIL) / 2;
    var pAbate = yd.abate[player().id];
    G.tradeDraft = pAbate.surplusDeficit >= 0
      ? { qty: Math.round(pAbate.surplusDeficit * 0.7), limitPrice: Math.round(priceGuess2 * 0.95) }
      : { qty: Math.round(Math.max(0, -pAbate.surplusDeficit - player().bank) * 0.85), limitPrice: Math.round(priceGuess2 * 1.15) };
    render();
  }

  function ensureYearData() {
    if (!G.yearData[G.year]) G.yearData[G.year] = { abate: {}, orders: [], auction: null, settled: {} };
    return G.yearData[G.year];
  }

  function submitTrading() {
    var yd = ensureYearData();
    var priceGuess = G.priceHistory.length ? G.priceHistory[G.priceHistory.length - 1].price : (PRICE_FLOOR + PRICE_CEIL) / 2;
    var orders = [];
    G.companies.forEach(function (c) {
      var sd = yd.abate[c.id].surplusDeficit;
      if (c.isPlayer) {
        var qty = clamp(G.tradeDraft.qty, 0, sd >= 0 ? sd : Math.max(0, -sd - c.bank));
        if (qty > 0) orders.push({ companyId: c.id, side: sd >= 0 ? "sell" : "buy", qty: qty, limitPrice: clamp(G.tradeDraft.limitPrice, PRICE_FLOOR, PRICE_CEIL) });
      } else {
        var o = botChooseOrder(c, sd, priceGuess);
        if (o && o.qty > 0.5) orders.push({ companyId: c.id, side: o.side, qty: o.qty, limitPrice: o.limitPrice });
      }
    });
    var auction = clearAuction(orders, priceGuess);
    yd.orders = orders;
    yd.auction = auction;
    G.priceHistory.push({ year: G.year, price: auction.clearingPrice });

    G.companies.forEach(function (c) {
      var ab = yd.abate[c.id];
      var sd = ab.surplusDeficit;
      var filled = auction.fills[c.id] || 0;
      var bankUsed = 0, bought = 0, sold = 0, penalty = 0, bankedNow = 0;
      if (sd >= 0) {
        sold = filled;
        bankedNow = sd - filled;
        c.bank += bankedNow;
      } else {
        var shortfall = -sd;
        bankUsed = Math.min(c.bank, shortfall);
        c.bank -= bankUsed;
        var remaining = shortfall - bankUsed;
        bought = Math.min(filled, remaining);
        var stillShort = remaining - bought;
        if (stillShort > 0.01) penalty = stillShort * 2 * auction.clearingPrice;
      }
      var revenue = c.margin * c.output;
      var netTrade = sold * auction.clearingPrice - bought * auction.clearingPrice;
      var yearProfit = revenue - ab.capex - penalty + netTrade;
      c.totalProfit += yearProfit;
      var rec = { year: G.year, target: ab.target, actual: ab.actualIntensity, surplusDeficit: sd, bankUsed: bankUsed, bought: bought, sold: sold, bankedNow: bankedNow, penalty: penalty, price: auction.clearingPrice, capex: ab.capex, yearProfit: yearProfit, bankEnd: c.bank };
      c.history.push(rec);
      yd.settled[c.id] = rec;
    });

    G.screen = "settlement";
    render();
  }

    if (G.year === 1) {

  /* ---------- charts ---------- */

  function svgOpen(w, h) { return '<svg viewBox="0 0 ' + w + ' ' + h + '" width="100%" height="' + h + '" role="img" preserveAspectRatio="xMidYMid meet">'; }

  function bulletChart(actual, target, baseline, w) {
    w = w || 460;
    var h = 64;
    var padL = 4, padR = 4;
    var innerW = w - padL - padR;
    var maxV = baseline * 1.05;
    var scale = function (v) { return padL + (v / maxV) * innerW; };
    var good = actual <= target;
    var color = good ? "var(--good)" : "var(--critical)";
    var svg = svgOpen(w, h);
    svg += '<rect x="' + padL + '" y="20" width="' + innerW + '" height="18" rx="4" fill="var(--grid)" />';
    svg += '<rect x="' + padL + '" y="20" width="' + scale(actual) + '" height="18" rx="4" fill="' + color + '" />';
    var tx = scale(target);
    svg += '<line x1="' + tx + '" y1="12" x2="' + tx + '" y2="46" stroke="var(--ink)" stroke-width="2.5" />';
    svg += '<text x="' + padL + '" y="10" font-size="10" letter-spacing="0.04em">0</text>';
    svg += '<text x="' + (w - padR) + '" y="10" font-size="10" text-anchor="end" letter-spacing="0.04em">BASELINE ' + num2.format(baseline) + '</text>';
    svg += '<text x="' + tx + '" y="60" font-size="10.5" text-anchor="middle" fill="var(--ink)" font-weight="700">TARGET ' + num2.format(target) + '</text>';
    svg += "</svg>";
    return svg;
  }

  function crossingChart(auction, w) {
    w = w || 520;
    var h = 220;
    var padL = 48, padR = 16, padT = 16, padB = 34;
    var innerW = w - padL - padR, innerH = h - padT - padB;
    var bids = auction.bids || [], asks = auction.asks || [];
    if (!bids.length || !asks.length) {
      return '<div class="muted" style="padding:2rem 0;text-align:center;">No crossing orders this round — market did not clear.</div>';
    }
    var maxQty = 0, cum;
    cum = 0; bids.forEach(function (b) { cum += b.qty; }); maxQty = Math.max(maxQty, cum);
    cum = 0; asks.forEach(function (a) { cum += a.qty; }); maxQty = Math.max(maxQty, cum);
    maxQty = maxQty * 1.08 || 1;
    var maxP = Math.max(PRICE_CEIL, auction.clearingPrice * 1.1);
    var minP = Math.min(PRICE_FLOOR, auction.clearingPrice * 0.9);
    var xScale = function (q) { return padL + (q / maxQty) * innerW; };
    var yScale = function (p) { return padT + innerH - ((p - minP) / (maxP - minP)) * innerH; };

    function pathFor(orders, ascending) {
      var pts = [];
      var c = 0;
      pts.push([xScale(0), yScale(orders[0].limitPrice)]);
      orders.forEach(function (o) {
        pts.push([xScale(c), yScale(o.limitPrice)]);
        c += o.qty;
        pts.push([xScale(c), yScale(o.limitPrice)]);
      });
      return pts.map(function (p, i) { return (i === 0 ? "M" : "L") + p[0].toFixed(1) + "," + p[1].toFixed(1); }).join(" ");
    }

    var svg = svgOpen(w, h);
    for (var i = 0; i <= 4; i++) {
      var gy = padT + (innerH / 4) * i;
      svg += '<line x1="' + padL + '" y1="' + gy + '" x2="' + (w - padR) + '" y2="' + gy + '" stroke="var(--grid)" stroke-width="1" />';
    }
    svg += '<line x1="' + padL + '" y1="' + padT + '" x2="' + padL + '" y2="' + (padT + innerH) + '" stroke="var(--baseline)" stroke-width="1" />';
    svg += '<line x1="' + padL + '" y1="' + (padT + innerH) + '" x2="' + (w - padR) + '" y2="' + (padT + innerH) + '" stroke="var(--baseline)" stroke-width="1" />';
    svg += '<path d="' + pathFor(bids, false) + '" fill="none" stroke="var(--price)" stroke-width="2.5" stroke-linecap="round" />';
    svg += '<path d="' + pathFor(asks, true) + '" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" />';
    var cy = yScale(auction.clearingPrice);
    svg += '<line x1="' + padL + '" y1="' + cy + '" x2="' + (w - padR) + '" y2="' + cy + '" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="3,3" />';
    svg += '<circle cx="' + xScale(auction.matchedTotal) + '" cy="' + cy + '" r="4.5" fill="var(--ink)" />';
    svg += '<text x="' + (w - padR) + '" y="' + (cy - 6) + '" font-size="11" text-anchor="end" font-weight="700" fill="var(--ink)">CLEARS AT ₹' + moneyInt.format(Math.round(auction.clearingPrice)) + '</text>';
    svg += '<text x="' + padL + '" y="' + (h - 10) + '" font-size="10" fill="var(--muted)">Quantity (tCO2e)</text>';
    svg += '<text x="' + (padL - 6) + '" y="' + padT + '" font-size="10" text-anchor="end" fill="var(--muted)">₹' + moneyInt.format(Math.round(maxP)) + '</text>';
    svg += '<text x="' + (padL - 6) + '" y="' + (padT + innerH) + '" font-size="10" text-anchor="end" fill="var(--muted)">₹' + moneyInt.format(Math.round(minP)) + '</text>';
    svg += "</svg>";
    return '<div class="row" style="gap:1.25rem;font-size:11.5px;color:var(--ink-2);margin-bottom:0.4rem;">' +
      '<span><svg width="14" height="10"><line x1="0" y1="5" x2="14" y2="5" stroke="var(--price)" stroke-width="2.5"/></svg> Demand (bids)</span>' +
      '<span><svg width="14" height="10"><line x1="0" y1="5" x2="14" y2="5" stroke="var(--accent)" stroke-width="2.5"/></svg> Supply (asks)</span>' +
      '</div>' + svg;
  }

  function priceTrajectoryChart(w, points) {
    w = w || 520;
    var h = 200;
    var padL = 48, padR = 16, padT = 18, padB = 30;
    var innerW = w - padL - padR, innerH = h - padT - padB;
    var pts = points || G.priceHistory;
    var maxP = Math.max(PRICE_CEIL, 1) * 1.05;
    var minP = 0;
    var xScale = function (i) { return pts.length > 1 ? padL + (i / (pts.length - 1)) * innerW : padL + innerW / 2; };
    var yScale = function (p) { return padT + innerH - ((p - minP) / (maxP - minP)) * innerH; };
    var svg = svgOpen(w, h);
    for (var i = 0; i <= 4; i++) {
      var gy = padT + (innerH / 4) * i;
      svg += '<line x1="' + padL + '" y1="' + gy + '" x2="' + (w - padR) + '" y2="' + gy + '" stroke="var(--grid)" stroke-width="1" />';
    }
    svg += '<line x1="' + padL + '" y1="' + yScale(PRICE_FLOOR) + '" x2="' + (w - padR) + '" y2="' + yScale(PRICE_FLOOR) + '" stroke="var(--baseline)" stroke-dasharray="2,3" />';
    svg += '<line x1="' + padL + '" y1="' + yScale(PRICE_CEIL) + '" x2="' + (w - padR) + '" y2="' + yScale(PRICE_CEIL) + '" stroke="var(--baseline)" stroke-dasharray="2,3" />';
    if (pts.length) {
      var area = "M" + xScale(0) + "," + (padT + innerH);
      pts.forEach(function (p, i) { area += " L" + xScale(i) + "," + yScale(p.price); });
      area += " L" + xScale(pts.length - 1) + "," + (padT + innerH) + " Z";
      svg += '<path d="' + area + '" fill="var(--price)" opacity="0.12" />';
      var line = pts.map(function (p, i) { return (i === 0 ? "M" : "L") + xScale(i) + "," + yScale(p.price); }).join(" ");
      svg += '<path d="' + line + '" fill="none" stroke="var(--price)" stroke-width="2.5" stroke-linecap="round" />';
      pts.forEach(function (p, i) {
        var last = i === pts.length - 1;
        svg += '<circle cx="' + xScale(i) + '" cy="' + yScale(p.price) + '" r="' + (last ? 5 : 3.5) + '" fill="var(--price)" />';
        svg += '<text x="' + xScale(i) + '" y="' + (yScale(p.price) - 12) + '" font-size="11" text-anchor="middle" font-weight="700" fill="var(--ink)">₹' + moneyInt.format(Math.round(p.price)) + '</text>';
        svg += '<text x="' + xScale(i) + '" y="' + (h - 8) + '" font-size="10.5" text-anchor="middle" fill="var(--muted)">FY 20' + (24 + p.year) + '-' + (25 + p.year) + '</text>';
      });
    }
    svg += "</svg>";
    return svg;
  }

  function leaderboardChart(companies, w) {
    w = w || 520;
    var rowH = 30;
    var h = companies.length * rowH + 10;
    var padL = 4, padR = 90;
    var innerW = w - padL - padR;
    var maxAbs = Math.max.apply(null, companies.map(function (c) { return Math.abs(c.totalProfit); })) || 1;
    var svg = svgOpen(w, h);
    companies.forEach(function (c, i) {

      var barW = (Math.abs(c.totalProfit) / maxAbs) * (innerW * 0.55);
      var lastRec = c.history[c.history.length - 1];
      var compliant = lastRec ? lastRec.penalty <= 0.01 : true;
      var color = c.totalProfit < 0 ? "var(--critical)" : (compliant ? "var(--good)" : "var(--warning)");

  function bandPriceChart(years, w) {
    w = w || 560;
    var h = 220;
    var padL = 56, padR = 20, padT = 32, padB = 46;
    var innerW = w - padL - padR, innerH = h - padT - padB;
    var maxP = Math.max(PRICE_CEIL, 1) * 1.05, minP = 0;
    var xScale = function (i) { return years.length > 1 ? padL + (i / (years.length - 1)) * innerW : padL + innerW / 2; };
    var yScale = function (p) { return padT + innerH - ((p - minP) / (maxP - minP)) * innerH; };
    var svg = svgOpen(w, h);
    for (var i = 0; i <= 4; i++) {
      var gy = padT + (innerH / 4) * i;
      svg += '<line x1="' + padL + '" y1="' + gy + '" x2="' + (w - padR) + '" y2="' + gy + '" stroke="var(--grid)" stroke-width="1" />';
    }
    var bandPath = "M" + xScale(0) + "," + yScale(years[0].priceP10);
    years.forEach(function (y, idx) { bandPath += " L" + xScale(idx) + "," + yScale(y.priceP10); });
    for (i = years.length - 1; i >= 0; i--) bandPath += " L" + xScale(i) + "," + yScale(years[i].priceP90);
    bandPath += " Z";
    svg += '<path d="' + bandPath + '" fill="var(--price)" opacity="0.14" />';
    var line = years.map(function (y, idx) { return (idx === 0 ? "M" : "L") + xScale(idx) + "," + yScale(y.priceMedian); }).join(" ");
    svg += '<path d="' + line + '" fill="none" stroke="var(--price)" stroke-width="2.5" stroke-linecap="round" />';
    years.forEach(function (y, idx) {
      svg += '<circle cx="' + xScale(idx) + '" cy="' + yScale(y.priceMedian) + '" r="4.5" fill="var(--price)" />';
      // Anchored to the band's own top/bottom (not the median dot) so the two labels
      // stay clear of each other even when P10-P90 collapses to a near-zero-width band.
      svg += '<text x="' + xScale(idx) + '" y="' + (yScale(y.priceP90) - 12) + '" font-size="11.5" text-anchor="middle" font-weight="700" fill="var(--ink)">₹' + moneyInt.format(Math.round(y.priceMedian)) + ' median</text>';
      svg += '<text x="' + xScale(idx) + '" y="' + (yScale(y.priceP10) + 18) + '" font-size="10" text-anchor="middle" fill="var(--muted)">P10 ₹' + moneyInt.format(Math.round(y.priceP10)) + ' – P90 ₹' + moneyInt.format(Math.round(y.priceP90)) + '</text>';
      svg += '<text x="' + xScale(idx) + '" y="' + (h - 8) + '" font-size="10.5" text-anchor="middle" fill="var(--muted)">FY 20' + (24 + y.year) + '-' + (25 + y.year) + '</text>';
    });
    svg += '<text x="' + padL + '" y="' + (padT - 6) + '" font-size="10" fill="var(--muted)">₹/tCO2e</text>';
    svg += "</svg>";
    return svg;
  }

  function coverageBar(y, w) {
    w = w || 520;
    var h = 40;
    var gap = 2;
    var padL = 4, padR = 4;
    var innerW = w - padL - padR - gap * 2;
    var total = y.bankShare + y.marketShare + y.penaltyShare || 1;
    var bw = (y.bankShare / total) * innerW, mw = (y.marketShare / total) * innerW, pw = (y.penaltyShare / total) * innerW;
    var svg = svgOpen(w, h);
    var x = padL;
    if (bw > 0) { svg += '<rect x="' + x + '" y="6" width="' + bw + '" height="20" rx="3" fill="var(--good)" />'; x += bw + gap; }
    if (mw > 0) { svg += '<rect x="' + x + '" y="6" width="' + mw + '" height="20" rx="3" fill="var(--price)" />'; x += mw + gap; }
    if (pw > 0) { svg += '<rect x="' + x + '" y="6" width="' + pw + '" height="20" rx="3" fill="var(--critical)" />'; }
    svg += "</svg>";
    return '<div>' +
      '<div style="font-size:12px;color:var(--ink-2);margin-bottom:0.3rem;">FY 20' + (24 + y.year) + '-' + (25 + y.year) + '</div>' +
      svg +
      '<div class="row" style="gap:1.1rem;font-size:11.5px;color:var(--ink-2);margin-top:0.35rem;">' +
        '<span><svg width="10" height="10"><rect width="10" height="10" rx="2" fill="var(--good)"/></svg> Bank draw ' + num2.format(y.bankShare) + '%</span>' +
        '<span><svg width="10" height="10"><rect width="10" height="10" rx="2" fill="var(--price)"/></svg> Bought on exchange ' + num2.format(y.marketShare) + '%</span>' +
        '<span><svg width="10" height="10"><rect width="10" height="10" rx="2" fill="var(--critical)"/></svg> Penalized ' + num2.format(y.penaltyShare) + '%</span>' +
      '</div>' +
    '</div>';
  }

  function complianceStatColor(rate) { return rate >= 80 ? "var(--good)" : rate >= 50 ? "var(--warning)" : "var(--critical)"; }

  function renderSimResults() {
    var res = G.simResult;
    var cfg = G.simConfig;
    var html = '<div class="wrap stack">' +
      '<div class="eyebrow">Market Simulator · ' + res.trials + ' trials · ' + moneyInt.format(cfg.firmsPerSector * SECTORS.length) + ' operators/trial</div>' +
      '<h1>Forecast results</h1>' +

      '<div class="chart-card"><h3 style="margin-top:0;">CCC clearing price — median, with 10th–90th percentile band</h3>' + bandPriceChart(res.years) + '</div>' +

      '<div class="row">' +
        res.years.map(function (y) {
          return '<div class="card" style="flex:1;min-width:220px;"><div class="kpi">' +
            '<span class="kv" style="color:' + complianceStatColor(y.complianceMean) + '">' + num2.format(y.complianceMean) + '%</span>' +
            '<span class="kl">FY 20' + (24 + y.year) + '-' + (25 + y.year) + ' Compliance Rate</span></div></div>';
        }).join("") +
        res.years.map(function (y) {
          var ratio = y.requiredAbatement ? (y.actualAbatement / y.requiredAbatement) * 100 : 0;
          return '<div class="card" style="flex:1;min-width:220px;"><div class="kpi">' +
            '<span class="kv">' + num2.format(ratio) + '%</span>' +
            '<span class="kl">FY 20' + (24 + y.year) + '-' + (25 + y.year) + ' Abatement Delivered vs. Required</span></div></div>';
        }).join("") +
      '</div>' +

      '<div class="card stack"><h3 style="margin:0;">How covered shortfalls were closed</h3>' +
        '<p style="margin:0;">Of all deficit tonnes across every simulated operator, the share resolved by drawing the bank, buying on the exchange, or absorbing the 2× penalty.</p>' +
        '<div class="row" style="gap:2rem;flex-wrap:wrap;">' + res.years.map(function (y) { return '<div style="flex:1;min-width:240px;">' + coverageBar(y) + '</div>'; }).join("") + '</div>' +
      '</div>' +

      '<div class="card"><h3 style="margin-top:0;">Sector breakdown</h3>' +
      '<div class="table-wrap"><table><thead><tr><th>Sector</th><th class="num">FY26 Compliant</th><th class="num">FY27 Compliant</th><th class="num">FY26 Abatement</th><th class="num">FY27 Abatement</th></tr></thead><tbody>' +
        SECTORS.map(function (s) {
          var y1 = res.years[0].sectorAgg[s.id], y2 = res.years[1].sectorAgg[s.id];
          var c1 = y1.total ? (y1.compliant / y1.total) * 100 : 0, c2 = y2.total ? (y2.compliant / y2.total) * 100 : 0;
          var a1 = y1.requiredCut ? (y1.actualCut / y1.requiredCut) * 100 : 0, a2 = y2.requiredCut ? (y2.actualCut / y2.requiredCut) * 100 : 0;
          return '<tr><td><strong>' + s.name + '</strong></td>' +
            '<td class="num" style="color:' + complianceStatColor(c1) + '">' + num2.format(c1) + '%</td>' +
            '<td class="num" style="color:' + complianceStatColor(c2) + '">' + num2.format(c2) + '%</td>' +
            '<td class="num">' + num2.format(a1) + '%</td>' +
            '<td class="num">' + num2.format(a2) + '%</td></tr>';
        }).join("") +
      '</tbody></table></div></div>' +

      '<div class="row" style="justify-content:space-between;">' +
        '<button class="btn btn-ghost" data-action="goto-simsetup">← Adjust Parameters</button>' +
        '<button class="btn" data-action="run-simulation">Run Again →</button>' +
      '</div>' +
      '<p class="foot-note">Every trial regenerates a fresh, randomized population of firms from the configured weights — re-running with identical settings will produce a similar but not identical forecast. Widen the trial count to narrow that variance.</p>' +
    '</div>';
    return html;
  }

  /* ---------- render: live multiplayer ---------- */

  function mpErrorBanner() {
    if (!MP.entryError) return "";
    return '<div class="card" style="border-color:var(--critical);"><p style="margin:0;color:var(--critical);">' + escapeHtml(MP.entryError) + '</p></div>';
  }

  function renderMultiplayer() {
    if (!MP.code || !MP.state) return renderMpEntry();
    switch (MP.state.phase) {
      case "lobby": return renderMpLobby();
      case "briefing": return renderMpBriefing();
      case "abatement": return renderMpAbatement();
      case "trading": return renderMpTrading();
      case "settlement": return renderMpSettlement();
      case "summary": return renderMpSummary();
      default: return "";

  }

  function renderMpEntry() {
    var last = null;
    try { last = sessionStorage.getItem("cctsMpLast"); } catch (e) {}
    return '<div class="wrap-narrow stack">' +
      '<div class="eyebrow">Live Multiplayer</div>' +
      '<h2>Host or join a room</h2>' +
      '<p>Each player claims one of the nine CCTS sectors on a shared exchange. Unclaimed sectors are auto-filled by AI operators when the host starts the game.</p>' +
      mpErrorBanner() +
      '<div class="card stack">' +
        '<h3 style="margin:0;">Host a new room</h3>' +
        '<p style="margin:0;">You\'ll get a 4-letter code to share with the rest of the group.</p>' +

        '<h3 style="margin:0;">Join a room</h3>' +
        '<label class="field">Room code<input type="text" id="mp-code-input" maxlength="4" style="text-transform:uppercase;font-family:var(--mono);font-size:1.1rem;letter-spacing:0.1em;" value="' + escapeHtml(MP.joinDraft.code) + '" placeholder="ABCD" /></label>' +
        '<button class="btn" data-action="mp-join-lookup" style="align-self:flex-start;"' + (MP.busy ? " disabled" : "") + '>Join Room →</button>' +
        (last ? '<button class="btn btn-ghost btn-sm" data-action="mp-rejoin-last" style="align-self:flex-start;">Rejoin last room (' + escapeHtml(last) + ') →</button>' : "") +

  function mpRoster(highlightPhase) {
    var subs = MP.state.submissions || { abatement: {}, trading: {} };
    return '<div class="card stack"><h3 style="margin:0;">Roster</h3><div class="stack" style="gap:0.5rem;">' +
      SECTORS.map(function (s) {
        var seat = MP.state.seats[s.id];
        var mine = MP.mySeat === s.id;
        var who = seat.claimedBy ? escapeHtml(seat.claimedBy) : "Open seat (AI-filled at start)";
        var statusPill = "";
        if (highlightPhase === "abatement" && seat.claimedBy) {
          statusPill = subs.abatement[s.id] != null ? '<span class="pill pill-good">Submitted</span>' : '<span class="pill pill-warn">Waiting</span>';
        } else if (highlightPhase === "trading" && seat.claimedBy) {
          statusPill = subs.trading[s.id] ? '<span class="pill pill-good">Submitted</span>' : '<span class="pill pill-warn">Waiting</span>';
        } else if (!seat.claimedBy) {
          statusPill = '<span class="pill pill-warn">AI</span>';
        }
        return '<div class="seat-row' + (mine ? " mine" : "") + '"><div><div class="s-sector">' + s.name + '</div><div class="s-who">' + who + '</div></div>' + statusPill + '</div>';
      }).join("") +
    '</div></div>';
  }

  function renderMpLobby() {
    var isHost = !!MP.hostToken;
    var claimedCount = SECTORS.filter(function (s) { return MP.state.seats[s.id].claimedBy; }).length;
    var html = '<div class="wrap grid-2">' +
      '<div class="stack">' +
        '<div class="card stack"><h3 style="margin:0;">Room code</h3><div class="code-display">' + MP.code + '</div>' +

      '</div>' +
      '<div class="stack">' +
        '<h2>Lobby</h2>' +
        mpErrorBanner() +
        (MP.mySeat ? "" :
          '<div class="card stack">' +
            '<h3 style="margin:0;">Claim a seat</h3>' +
            '<label class="field">Your name<input type="text" id="mp-name-input" maxlength="40" value="' + escapeHtml(MP.seatDraft.name) + '" /></label>' +
            '<div class="archetype-grid">' + ARCHETYPES.map(function (a) {

        ) +

            '<div class="st-name">' + s.name + '</div>' +
            '<div class="st-meta">' + (seat.claimedBy ? "Claimed — " + escapeHtml(seat.claimedBy) : "Open") + '</div>' +
          '</div>';

        '</div>' +
      '</div>' +
    '</div>';
    return html;
  }

  function mpStepsBar(current) {
    var order = ["briefing", "abatement", "trading", "settlement"];
    var labels = { briefing: "Target Briefing", abatement: "Abatement Plan", trading: "Exchange", settlement: "Settlement" };
    var idx = order.indexOf(current);
    return '<div class="steps">' + order.map(function (s, i) {
      var cls = i === idx ? "on" : (i < idx ? "done" : "");
      return '<span class="step ' + cls + '">' + (i + 1) + "  " + labels[s] + '</span>';
    }).join("") + '</div>';
  }

  function mpHeader() {
    var yearLabel = MP.state.year === 1 ? "FY 2025-26" : "FY 2026-27";
    return '<div class="eyebrow">Room ' + MP.code + ' · Compliance Period ' + MP.state.year + ' of 2 · ' + yearLabel + '</div>';
  }

  function mpAdvanceControl(label) {
    if (!MP.hostToken) return '<span class="muted">Waiting for the host to advance…</span>';
    return '<button class="btn" data-action="mp-advance"' + (MP.busy ? " disabled" : "") + '>' + label + '</button>';
  }

  function renderMpBriefing() {
    var mine = mpMyCompany();
    var sector = mine ? sectorById(mine.sectorId) : null;
    var html = '<div class="wrap grid-2">' +
      '<div class="stack">' + mpRoster() + '</div>' +
      '<div class="stack">' +
        mpStepsBar("briefing") + mpHeader() +
        '<h2>Target notified</h2>' +
        mpErrorBanner() +
        (mine
          ? '<div class="card stack"><p>Your entity-level target for this period:</p>' +
            '<div class="kpi-row">' +
              '<div class="kpi"><span class="kv">' + num2.format(mine.baselineIntensity) + '</span><span class="kl">FY23-24 Baseline</span></div>' +
              '<div class="kpi"><span class="kv">' + num2.format(targetIntensity(mine, sector, MP.state.year)) + '</span><span class="kl">Target Intensity</span></div>' +
            '</div></div>'
          : '<div class="card"><p style="margin:0;">You\'re spectating this room — no seat claimed.</p></div>') +
        '<div class="row" style="justify-content:flex-end;">' + mpAdvanceControl("Open Abatement Window →") + '</div>' +
      '</div>' +
    '</div>';
    return html;
  }

  function renderMpAbatement() {
    var mine = mpMyCompany();
    if (!mine) {
      return '<div class="wrap grid-2"><div class="stack">' + mpRoster("abatement") + '</div><div class="stack">' + mpStepsBar("abatement") + mpHeader() + '<div class="card"><p style="margin:0;">Spectating — waiting for operators to plan their abatement.</p></div>' + '<div class="row" style="justify-content:flex-end;">' + mpAdvanceControl("Open Exchange →") + '</div></div></div>';
    }
    if (MP.abateDraftYear !== MP.state.year) { MP.abateDraft = mine.activatedCount; MP.abateDraftYear = MP.state.year; }
    var sector = sectorById(mine.sectorId);
    var target = targetIntensity(mine, sector, MP.state.year);
    var alreadySubmitted = MP.state.submissions.abatement[MP.mySeat] != null;
    var count = alreadySubmitted ? MP.state.submissions.abatement[MP.mySeat] : MP.abateDraft;
    var reduced = cumulativeReduction(mine, count);
    var actual = mine.baselineIntensity - reduced;
    var capex = newMeasuresCost(mine, mine.activatedCount, count);
    var html = '<div class="wrap grid-2">' +
      '<div class="stack">' + mpRoster("abatement") + '</div>' +
      '<div class="stack">' +
        mpStepsBar("abatement") + mpHeader() +
        '<h2>Abatement plan</h2>' +
        mpErrorBanner() +
        '<div class="chart-card">' + bulletChart(actual, target, mine.baselineIntensity) + '</div>' +
        '<div class="card stack" id="mp-measure-list">' + measureRows(mine, count) + '</div>' +
        (alreadySubmitted
          ? '<div class="card"><p style="margin:0;">Submitted — ' + count + ' measure(s) active. You can still change this until the host advances.</p></div>'
          : "") +
        '<input type="range" min="0" max="4" step="1" value="' + count + '" id="mp-abate-slider" />' +
        '<div class="row" style="justify-content:space-between;">' +
          '<div class="kpi"><span class="kv" id="mp-abate-capex">' + cr(capex) + '</span><span class="kl">Capex This Period</span></div>' +
          '<div class="kpi"><span class="kv" id="mp-abate-intensity" style="color:' + (actual <= target ? "var(--good)" : "var(--critical)") + '">' + num2.format(actual) + '</span><span class="kl">Resulting Intensity</span></div>' +
        '</div>' +
        '<div class="row" style="justify-content:space-between;">' +
          '<button class="btn btn-ghost" data-action="mp-submit-abatement"' + (MP.busy ? " disabled" : "") + '>' + (alreadySubmitted ? "Update Submission" : "Submit Plan") + '</button>' +
          mpAdvanceControl("Open Exchange →") +
        '</div>' +
      '</div>' +
    '</div>';
    return html;
  }

  function renderMpTrading() {
    var mine = mpMyCompany();
    var yd = MP.state.yearData[MP.state.year] || {};
    if (!mine) {
      return '<div class="wrap grid-2"><div class="stack">' + mpRoster("trading") + '</div><div class="stack">' + mpStepsBar("trading") + mpHeader() + '<div class="card"><p style="margin:0;">Spectating — waiting for operators to trade.</p></div>' + '<div class="row" style="justify-content:flex-end;">' + mpAdvanceControl("Settle →") + '</div></div></div>';
    }
    var ab = yd.abate ? yd.abate[MP.mySeat] : null;
    if (!ab) return '<div class="wrap"><p>Waiting for abatement to resolve…</p></div>';
    if (MP.tradeDraftYear !== MP.state.year) { MP.tradeDraft = { qty: 0, limitPrice: PRICE_FLOOR }; MP.tradeDraftYear = MP.state.year; }
    var sd = ab.surplusDeficit;
    var isSeller = sd >= 0;
    var maxQty = isSeller ? Math.max(0, sd) : Math.max(0, -sd - mine.bank);
    var already = MP.state.submissions.trading[MP.mySeat];
    var priceGuess = MP.state.priceHistory.length ? MP.state.priceHistory[MP.state.priceHistory.length - 1].price : (PRICE_FLOOR + PRICE_CEIL) / 2;
    var html = '<div class="wrap grid-2">' +
      '<div class="stack">' + mpRoster("trading") +
        '<div class="card"><h3 style="margin-top:0;">Your position</h3><div class="kpi-row">' +
          '<div class="kpi"><span class="kv">' + num2.format(Math.abs(sd)) + '</span><span class="kl">tCO2e ' + (isSeller ? "Surplus" : "Deficit") + '</span></div>' +
          '<div class="kpi"><span class="kv">' + moneyInt.format(Math.round(mine.bank)) + '</span><span class="kl">Bank</span></div>' +
        '</div></div>' +
      '</div>' +
      '<div class="stack">' +
        mpStepsBar("trading") + mpHeader() +
        '<h2>Exchange</h2>' +
        mpErrorBanner() +
        '<div class="card stack">' +
          '<div class="row">' +
            '<label class="field" style="flex:1;">Quantity to ' + (isSeller ? "sell" : "buy") + ' (of ' + moneyInt.format(Math.round(maxQty)) + ')' +
              '<input type="number" id="mp-trade-qty" min="0" max="' + Math.round(maxQty) + '" value="' + Math.round(already ? already.qty : MP.tradeDraft.qty) + '" /></label>' +
            '<label class="field" style="flex:1;">' + (isSeller ? "Minimum price" : "Maximum price") + ' (₹/tCO2e)' +
              '<input type="number" id="mp-trade-price" min="' + PRICE_FLOOR + '" max="' + PRICE_CEIL + '" value="' + Math.round(already ? already.limitPrice : MP.tradeDraft.limitPrice) + '" /></label>' +
          '</div>' +
          '<p class="muted" style="margin:0;">Reference price: ' + rupee(priceGuess) + '/tCO2e.' + (already ? " Submitted — you can still update until the host advances." : "") + '</p>' +
        '</div>' +
        '<div class="row" style="justify-content:space-between;">' +
          '<button class="btn btn-ghost" data-action="mp-submit-order"' + (MP.busy ? " disabled" : "") + '>' + (already ? "Update Order" : "Submit Order") + '</button>' +
          mpAdvanceControl("Settle →") +
        '</div>' +
      '</div>' +
    '</div>';
    return html;
  }

    var ranked = Object.keys(MP.state.companies).map(function (id) { return MP.state.companies[id]; }).sort(function (a, b) { return b.totalProfit - a.totalProfit; });

        '<h2>Settlement</h2>' +
        mpErrorBanner() +

    var mine = mpMyCompany();

      '<div class="eyebrow">Room ' + MP.code + ' · Compliance period closed</div>' +
      '<h1>Final results</h1>' +
      (mine ? '<div class="row">' +
        '<div class="card" style="flex:1;min-width:200px;"><div class="kpi"><span class="kv">#' + rank + ' of 9</span><span class="kl">Your Rank</span></div></div>' +
        '<div class="card" style="flex:1;min-width:200px;"><div class="kpi"><span class="kv">' + cr(mine.totalProfit) + '</span><span class="kl">Your Cumulative Profit</span></div></div>' +
      '</div>' : "") +
      '<div class="row" style="align-items:flex-start;">' +
        '<div class="chart-card" style="flex:1;min-width:320px;"><h3 style="margin-top:0;">CCC clearing price by period</h3>' + priceTrajectoryChart(520, MP.state.priceHistory) + '</div>' +
        '<div class="card" style="flex:1;min-width:320px;"><h3 style="margin-top:0;">Nine-operator leaderboard</h3>' + leaderboardChart(ranked) + '</div>' +
      '</div>' +
      '<div class="row" style="justify-content:flex-end;"><button class="btn" data-action="mp-leave">Leave Room →</button></div>' +
    '</div>';
    return html;
  }

  /* ---------- events ---------- */

  function bindEvents() {
    var app = document.getElementById("app");
    app.onclick = function (e) {
      var el = e.target.closest("[data-action]");
      if (!el) return;
      var action = el.getAttribute("data-action");
      if (action === "goto-setup") { G.screen = "setup"; render(); }
      else if (action === "back-landing") { G.screen = "landing"; render(); }
      else if (action === "pick-sector") { G.draft.sectorId = el.getAttribute("data-id"); render(); }
      else if (action === "pick-archetype") { G.draft.archetypeId = el.getAttribute("data-id"); render(); }
      else if (action === "start-game") { startGame(); }
      else if (action === "goto-abatement") { beginAbatement(); }
      else if (action === "confirm-abatement") { confirmAbatement(); }
      else if (action === "submit-trading") { submitTrading(); }
      else if (action === "next-year") { nextYear(); }
      else if (action === "restart") { restart(); }
      else if (action === "goto-simsetup") { goToSimSetup(); }
      else if (action === "run-simulation") { launchSimulation(); }
      else if (action === "pick-variance") { G.simConfig.varianceLabel = el.getAttribute("data-id"); render(); }
      else if (action === "goto-mp") { mpReset(); G.screen = "mp"; render(); }
      else if (action === "mp-create") { mpCreateRoom(); }
      else if (action === "mp-join-lookup") {
        var codeEl = document.getElementById("mp-code-input");
        if (codeEl) MP.joinDraft.code = codeEl.value;
        mpJoinRoomLookup();
      }
      else if (action === "mp-rejoin-last") {
        var lastCode = null;
        try { lastCode = sessionStorage.getItem("cctsMpLast"); } catch (err) {}
        if (lastCode) { MP.joinDraft.code = lastCode; mpJoinRoomLookup(); }
      }
      else if (action === "mp-pick-archetype") { MP.seatDraft.archetypeId = el.getAttribute("data-id"); render(); }
      else if (action === "mp-claim-seat") {
        var nameEl = document.getElementById("mp-name-input");
        if (nameEl) MP.seatDraft.name = nameEl.value;
        mpClaimSeat(el.getAttribute("data-id"));
      }
      else if (action === "mp-start-game") { mpStartGame(); }
      else if (action === "mp-advance") { mpAdvancePhase(); }
      else if (action === "mp-submit-abatement") { mpSubmitAbatement(); }
      else if (action === "mp-submit-order") { mpSubmitOrder(); }
      else if (action === "mp-leave") { mpReset(); G.screen = "landing"; render(); }
    };
    var slider = document.getElementById("abate-slider");
    if (slider) {
      slider.oninput = function () {
        G.abateDraft = parseInt(slider.value, 10);
        var p = player();
        var sec = sectorById(p.sectorId);
        var target = targetIntensity(p, sec, G.year);
        var reduced = cumulativeReduction(p, G.abateDraft);
        var actual = p.baselineIntensity - reduced;
        var capex = newMeasuresCost(p, p.activatedCount, G.abateDraft);
        document.getElementById("abate-capex").textContent = cr(capex);
        var intensityEl = document.getElementById("abate-intensity");
        intensityEl.textContent = num2.format(actual);
        intensityEl.style.color = actual <= target ? "var(--good)" : "var(--critical)";
        document.getElementById("measure-list").innerHTML = measureRows(p, G.abateDraft);
      };
    }
    var qtyEl = document.getElementById("trade-qty");
    var priceEl = document.getElementById("trade-price");
    if (qtyEl) qtyEl.oninput = function () { G.tradeDraft.qty = parseFloat(qtyEl.value) || 0; };
    if (priceEl) priceEl.oninput = function () { G.tradeDraft.limitPrice = parseFloat(priceEl.value) || PRICE_FLOOR; };

    var firmsEl = document.getElementById("sim-firms");
    if (firmsEl) {
      firmsEl.oninput = function () {
        G.simConfig.firmsPerSector = parseInt(firmsEl.value, 10);
        document.getElementById("sim-firms-val").textContent = G.simConfig.firmsPerSector;
        document.getElementById("sim-total-operators").textContent = moneyInt.format(G.simConfig.firmsPerSector * SECTORS.length) + " operators simulated per trial, across all 9 sectors.";
      };
    }
    var trialsEl = document.getElementById("sim-trials");
    if (trialsEl) {
      trialsEl.oninput = function () {
        G.simConfig.trials = parseInt(trialsEl.value, 10);
        document.getElementById("sim-trials-val").textContent = G.simConfig.trials;
      };
    }
    var weightEls = document.querySelectorAll(".sim-weight");
    weightEls.forEach(function (el) {
      el.oninput = function () {
        var kind = el.getAttribute("data-kind");
        var idx = parseInt(el.getAttribute("data-idx"), 10);
        var weights = kind === "arche" ? G.simConfig.archetypeWeights : G.simConfig.strategyWeights;
        weights[idx] = parseInt(el.value, 10);
        weights.forEach(function (w, i) {
          var span = document.getElementById(kind + "-pct-" + i);
          if (span) span.textContent = Math.round(weightPct(weights, i)) + "%";
        });
      };
    });

    var mpCodeEl = document.getElementById("mp-code-input");
    if (mpCodeEl) mpCodeEl.oninput = function () { MP.joinDraft.code = mpCodeEl.value.toUpperCase(); };
    var mpNameEl = document.getElementById("mp-name-input");
    if (mpNameEl) mpNameEl.oninput = function () { MP.seatDraft.name = mpNameEl.value; };

    var mpAbateSlider = document.getElementById("mp-abate-slider");
    if (mpAbateSlider) {
      mpAbateSlider.oninput = function () {
        MP.abateDraft = parseInt(mpAbateSlider.value, 10);
        var mine = mpMyCompany();
        var sector = sectorById(mine.sectorId);
        var target = targetIntensity(mine, sector, MP.state.year);
        var reduced = cumulativeReduction(mine, MP.abateDraft);
        var actual = mine.baselineIntensity - reduced;
        var capex = newMeasuresCost(mine, mine.activatedCount, MP.abateDraft);
        document.getElementById("mp-abate-capex").textContent = cr(capex);
        var intensityEl = document.getElementById("mp-abate-intensity");
        intensityEl.textContent = num2.format(actual);
        intensityEl.style.color = actual <= target ? "var(--good)" : "var(--critical)";
        document.getElementById("mp-measure-list").innerHTML = measureRows(mine, MP.abateDraft);
      };
    }
    var mpQtyEl = document.getElementById("mp-trade-qty");
    var mpPriceEl = document.getElementById("mp-trade-price");
    if (mpQtyEl) mpQtyEl.oninput = function () { MP.tradeDraft.qty = parseFloat(mpQtyEl.value) || 0; };
    if (mpPriceEl) mpPriceEl.oninput = function () { MP.tradeDraft.limitPrice = parseFloat(mpPriceEl.value) || PRICE_FLOOR; };
  }

  render();
})();
</script>
