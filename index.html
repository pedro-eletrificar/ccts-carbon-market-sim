<script>
(function () {
  "use strict";

  /* ---------- formatters (SECTORS/ARCHETYPES/engine functions now come from engine.js) ---------- */

  var money = new Intl.NumberFormat("en-IN", { maximumFractionDigits: 2 });
  var moneyInt = new Intl.NumberFormat("en-IN", { maximumFractionDigits: 0 });
  var num2 = new Intl.NumberFormat("en-IN", { maximumFractionDigits: 2 });

  function cr(v) { return "₹" + money.format(v / 1e7) + " Cr"; }
  // Several sectors' real MACC data includes net cost-SAVING measures (an
  // efficiency retrofit that pays for itself, say) — newMeasuresCost can
  // come back negative. "₹-5.2 Cr" reads like a formatting bug; flip the
  // sign and say "saved" instead, so a profitable abatement measure reads
  // as the deliberate, real feature it is.
  function capexLabel(v) { return v >= 0 ? cr(v) : cr(-v) + " saved"; }
  function rupee(v) { return "₹" + moneyInt.format(Math.round(v)); }
  function pct(v) { return num2.format(v) + "%"; }
  function fyLabel(year) { return "FY 20" + (24 + year) + "-" + (25 + year); }

  /* ---------- batch / Monte Carlo simulator ---------- */

  function runSimTrial(cfg) {
    var firms = [];
    SECTORS.forEach(function (sector) {
      for (var i = 0; i < cfg.firmsPerSector; i++) {
        var archetype = weightedPick(ARCHETYPES, cfg.archetypeWeights);
        var strategy = weightedPick(BOT_STRATEGIES, cfg.strategyWeights);
        firms.push(generateCompany(sector, archetype, false, strategy, cfg.variance, sector.id + "-" + i));
      }
    });

    var priceHistory = [];
    var yearMetrics = [];
    var cbamConfig = { enabled: !!cfg.cbamEnabled, article9Recognized: !!cfg.cbamArticle9Recognized };

    for (var year = 1; year <= TOTAL_YEARS; year++) {
      var priceGuess = priceHistory.length ? priceHistory[priceHistory.length - 1] : (PRICE_FLOOR + PRICE_CEIL) / 2;
      var scenario = pickScenario();
      var abate = resolveAbatement(firms, year, priceGuess, botChooseAbatement, botChooseProduction, scenario);
      var trading = resolveTrading(firms, abate, priceGuess, botChooseOrder, year, cbamConfig, botChooseCbam);
      priceHistory.push(trading.auction.clearingPrice);

      var m = {
        year: year, price: trading.auction.clearingPrice,
        requiredAbatement: 0, actualAbatement: 0,
        coveredByBank: 0, coveredByMarket: 0, penalizedTonnes: 0,
        compliantCount: 0, firmCount: firms.length,
        cbamCost: 0, cbamCertificates: 0, cbamExposedCount: 0,
        sectorStats: {}
      };
      SECTORS.forEach(function (s) { m.sectorStats[s.id] = { compliant: 0, total: 0, actualCut: 0, requiredCut: 0 }; });

      firms.forEach(function (c) {
        var ab = abate[c.id];
        var rec = trading.settled[c.id];
        var req = (c.baselineIntensity - ab.target) * c.output;
        var act = (c.baselineIntensity - ab.actualIntensity) * c.output;
        m.requiredAbatement += req;
        m.actualAbatement += act;
        m.coveredByBank += rec.bankUsed;
        m.coveredByMarket += rec.bought;
        m.penalizedTonnes += rec.penaltyTonnes;
        var compliant = rec.penaltyTonnes <= 0.01;
        if (compliant) m.compliantCount++;
        if (rec.cbam && rec.cbam.euShare > 0) {
          m.cbamCost += rec.cbam.cbamCost + rec.cbam.verificationCost;
          m.cbamCertificates += rec.cbam.certificates;
          m.cbamExposedCount++;
        }
        var ss = m.sectorStats[c.sectorId];
        ss.total++; if (compliant) ss.compliant++;
        ss.actualCut += act; ss.requiredCut += req;
      });
      yearMetrics.push(m);
    }
    return yearMetrics;
  }

  function runSimulation(cfg) {
    var perYear = [];
    for (var y = 0; y < TOTAL_YEARS; y++) perYear.push([]);
    for (var t = 0; t < cfg.trials; t++) {
      var ym = runSimTrial(cfg);
      for (var y2 = 0; y2 < TOTAL_YEARS; y2++) perYear[y2].push(ym[y2]);
    }
    var result = { years: [], trials: cfg.trials };
    perYear.forEach(function (trialsForYear) {
      var prices = trialsForYear.map(function (m) { return m.price; }).sort(function (a, b) { return a - b; });
      var complianceRates = trialsForYear.map(function (m) { return m.compliantCount / m.firmCount * 100; });
      var reqTotal = trialsForYear.reduce(function (s, m) { return s + m.requiredAbatement; }, 0);
      var actTotal = trialsForYear.reduce(function (s, m) { return s + m.actualAbatement; }, 0);
      var bankTotal = trialsForYear.reduce(function (s, m) { return s + m.coveredByBank; }, 0);
      var marketTotal = trialsForYear.reduce(function (s, m) { return s + m.coveredByMarket; }, 0);
      var penaltyTotal = trialsForYear.reduce(function (s, m) { return s + m.penalizedTonnes; }, 0);
      var deficitTotal = bankTotal + marketTotal + penaltyTotal;
      var cbamCostTotal = trialsForYear.reduce(function (s, m) { return s + m.cbamCost; }, 0);
      var cbamCertTotal = trialsForYear.reduce(function (s, m) { return s + m.cbamCertificates; }, 0);
      var cbamExposedTotal = trialsForYear.reduce(function (s, m) { return s + m.cbamExposedCount; }, 0);
      var sectorAgg = {};
      SECTORS.forEach(function (s) { sectorAgg[s.id] = { compliant: 0, total: 0, actualCut: 0, requiredCut: 0 }; });
      trialsForYear.forEach(function (m) {
        SECTORS.forEach(function (s) {
          var ss = m.sectorStats[s.id];
          sectorAgg[s.id].compliant += ss.compliant;
          sectorAgg[s.id].total += ss.total;
          sectorAgg[s.id].actualCut += ss.actualCut;
          sectorAgg[s.id].requiredCut += ss.requiredCut;
        });
      });
      result.years.push({
        year: trialsForYear[0].year,
        priceMedian: percentile(prices, 50), priceP10: percentile(prices, 10), priceP90: percentile(prices, 90),
        complianceMean: complianceRates.reduce(function (s, v) { return s + v; }, 0) / complianceRates.length,
        requiredAbatement: reqTotal / cfg.trials, actualAbatement: actTotal / cfg.trials,
        bankShare: deficitTotal ? bankTotal / deficitTotal * 100 : 0,
        marketShare: deficitTotal ? marketTotal / deficitTotal * 100 : 0,
        penaltyShare: deficitTotal ? penaltyTotal / deficitTotal * 100 : 0,
        cbamCost: cbamCostTotal / cfg.trials, cbamCertificates: cbamCertTotal / cfg.trials, cbamExposedCount: cbamExposedTotal / cfg.trials,
        sectorAgg: sectorAgg
      });
    });
    return result;
  }

  function svgOpen(w, h) { return '<svg viewBox="0 0 ' + w + ' ' + h + '" width="100%" height="' + h + '" role="img" preserveAspectRatio="xMidYMid meet">'; }

  function bulletChart(actual, target, baseline, w) {
    w = w || 460;
    var h = 64;
    var padL = 4, padR = 4;
    var innerW = w - padL - padR;
    var maxV = baseline * 1.05;
    var scale = function (v) { return padL + (v / maxV) * innerW; };
    var good = actual <= target;
    var color = good ? "var(--good)" : "var(--critical)";
    var svg = svgOpen(w, h);
    svg += '<rect x="' + padL + '" y="20" width="' + innerW + '" height="18" rx="4" fill="var(--grid)" />';
    svg += '<rect x="' + padL + '" y="20" width="' + scale(actual) + '" height="18" rx="4" fill="' + color + '" />';
    var tx = scale(target);
    svg += '<line x1="' + tx + '" y1="12" x2="' + tx + '" y2="46" stroke="var(--ink)" stroke-width="2.5" />';
    svg += '<text x="' + padL + '" y="10" font-size="10" letter-spacing="0.04em">0</text>';
    svg += '<text x="' + (w - padR) + '" y="10" font-size="10" text-anchor="end" letter-spacing="0.04em">BASELINE ' + num2.format(baseline) + '</text>';
    svg += '<text x="' + tx + '" y="60" font-size="10.5" text-anchor="middle" fill="var(--ink)" font-weight="700">TARGET ' + num2.format(target) + '</text>';
    svg += "</svg>";
    return svg;
  }

  function crossingChart(auction, w) {
    w = w || 520;
    var h = 220;
    var padL = 48, padR = 16, padT = 16, padB = 34;
    var innerW = w - padL - padR, innerH = h - padT - padB;
    var bids = auction.bids || [], asks = auction.asks || [];
    if (!bids.length || !asks.length) {
      return '<div class="muted" style="padding:2rem 0;text-align:center;">No crossing orders this round — market did not clear.</div>';
    }
    var maxQty = 0, cum;
    cum = 0; bids.forEach(function (b) { cum += b.qty; }); maxQty = Math.max(maxQty, cum);
    cum = 0; asks.forEach(function (a) { cum += a.qty; }); maxQty = Math.max(maxQty, cum);
    maxQty = maxQty * 1.08 || 1;
    var maxP = Math.max(PRICE_CEIL, auction.clearingPrice * 1.1);
    var minP = Math.min(PRICE_FLOOR, auction.clearingPrice * 0.9);
    var xScale = function (q) { return padL + (q / maxQty) * innerW; };
    var yScale = function (p) { return padT + innerH - ((p - minP) / (maxP - minP)) * innerH; };

    function pathFor(orders, ascending) {
      var pts = [];
      var c = 0;
      pts.push([xScale(0), yScale(orders[0].limitPrice)]);
      orders.forEach(function (o) {
        pts.push([xScale(c), yScale(o.limitPrice)]);
        c += o.qty;
        pts.push([xScale(c), yScale(o.limitPrice)]);
      });
      return pts.map(function (p, i) { return (i === 0 ? "M" : "L") + p[0].toFixed(1) + "," + p[1].toFixed(1); }).join(" ");
    }

    var svg = svgOpen(w, h);
    for (var i = 0; i <= 4; i++) {
      var gy = padT + (innerH / 4) * i;
      svg += '<line x1="' + padL + '" y1="' + gy + '" x2="' + (w - padR) + '" y2="' + gy + '" stroke="var(--grid)" stroke-width="1" />';
    }
    svg += '<line x1="' + padL + '" y1="' + padT + '" x2="' + padL + '" y2="' + (padT + innerH) + '" stroke="var(--baseline)" stroke-width="1" />';
    svg += '<line x1="' + padL + '" y1="' + (padT + innerH) + '" x2="' + (w - padR) + '" y2="' + (padT + innerH) + '" stroke="var(--baseline)" stroke-width="1" />';
    svg += '<path d="' + pathFor(bids, false) + '" fill="none" stroke="var(--price)" stroke-width="2.5" stroke-linecap="round" />';
    svg += '<path d="' + pathFor(asks, true) + '" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" />';
    var cy = yScale(auction.clearingPrice);
    svg += '<line x1="' + padL + '" y1="' + cy + '" x2="' + (w - padR) + '" y2="' + cy + '" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="3,3" />';
    svg += '<circle cx="' + xScale(auction.matchedTotal) + '" cy="' + cy + '" r="4.5" fill="var(--ink)" />';
    svg += '<text x="' + (w - padR) + '" y="' + (cy - 6) + '" font-size="11" text-anchor="end" font-weight="700" fill="var(--ink)">CLEARS AT ₹' + moneyInt.format(Math.round(auction.clearingPrice)) + '</text>';
    svg += '<text x="' + padL + '" y="' + (h - 10) + '" font-size="10" fill="var(--muted)">Quantity (tCO2e)</text>';
    svg += '<text x="' + (padL - 6) + '" y="' + padT + '" font-size="10" text-anchor="end" fill="var(--muted)">₹' + moneyInt.format(Math.round(maxP)) + '</text>';
    svg += '<text x="' + (padL - 6) + '" y="' + (padT + innerH) + '" font-size="10" text-anchor="end" fill="var(--muted)">₹' + moneyInt.format(Math.round(minP)) + '</text>';
    svg += "</svg>";
    return '<div class="row" style="gap:1.25rem;font-size:11.5px;color:var(--ink-2);margin-bottom:0.4rem;">' +
      '<span><svg width="14" height="10"><line x1="0" y1="5" x2="14" y2="5" stroke="var(--price)" stroke-width="2.5"/></svg> Demand (bids)</span>' +
      '<span><svg width="14" height="10"><line x1="0" y1="5" x2="14" y2="5" stroke="var(--accent)" stroke-width="2.5"/></svg> Supply (asks)</span>' +
      '</div>' + svg;
  }

  function priceTrajectoryChart(w, points) {
    w = w || 520;
    var h = 200;
    var padL = 48, padR = 16, padT = 18, padB = 30;
    var innerW = w - padL - padR, innerH = h - padT - padB;
    var pts = points || G.priceHistory;
    var maxP = Math.max(PRICE_CEIL, 1) * 1.05;
    var minP = 0;
    var xScale = function (i) { return pts.length > 1 ? padL + (i / (pts.length - 1)) * innerW : padL + innerW / 2; };
    var yScale = function (p) { return padT + innerH - ((p - minP) / (maxP - minP)) * innerH; };
    var svg = svgOpen(w, h);
    for (var i = 0; i <= 4; i++) {
      var gy = padT + (innerH / 4) * i;
      svg += '<line x1="' + padL + '" y1="' + gy + '" x2="' + (w - padR) + '" y2="' + gy + '" stroke="var(--grid)" stroke-width="1" />';
    }
    svg += '<line x1="' + padL + '" y1="' + yScale(PRICE_FLOOR) + '" x2="' + (w - padR) + '" y2="' + yScale(PRICE_FLOOR) + '" stroke="var(--baseline)" stroke-dasharray="2,3" />';
    svg += '<line x1="' + padL + '" y1="' + yScale(PRICE_CEIL) + '" x2="' + (w - padR) + '" y2="' + yScale(PRICE_CEIL) + '" stroke="var(--baseline)" stroke-dasharray="2,3" />';
    if (pts.length) {
      var area = "M" + xScale(0) + "," + (padT + innerH);
      pts.forEach(function (p, i) { area += " L" + xScale(i) + "," + yScale(p.price); });
      area += " L" + xScale(pts.length - 1) + "," + (padT + innerH) + " Z";
      svg += '<path d="' + area + '" fill="var(--price)" opacity="0.12" />';
      var line = pts.map(function (p, i) { return (i === 0 ? "M" : "L") + xScale(i) + "," + yScale(p.price); }).join(" ");
      svg += '<path d="' + line + '" fill="none" stroke="var(--price)" stroke-width="2.5" stroke-linecap="round" />';
      pts.forEach(function (p, i) {
        var last = i === pts.length - 1;
        svg += '<circle cx="' + xScale(i) + '" cy="' + yScale(p.price) + '" r="' + (last ? 5 : 3.5) + '" fill="var(--price)" />';
        svg += '<text x="' + xScale(i) + '" y="' + (yScale(p.price) - 12) + '" font-size="11" text-anchor="middle" font-weight="700" fill="var(--ink)">₹' + moneyInt.format(Math.round(p.price)) + '</text>';
        svg += '<text x="' + xScale(i) + '" y="' + (h - 8) + '" font-size="10.5" text-anchor="middle" fill="var(--muted)">FY 20' + (24 + p.year) + '-' + (25 + p.year) + '</text>';
      });
    }
    svg += "</svg>";
    return svg;
  }

  function debriefProfitChart(actualPoints, cfPoints, w) {
    w = w || 520;
    var h = 200;
    var padL = 60, padR = 16, padT = 18, padB = 30;
    var innerW = w - padL - padR, innerH = h - padT - padB;
    var allV = actualPoints.concat(cfPoints).concat([0]);
    var maxV = Math.max.apply(null, allV), minV = Math.min.apply(null, allV);
    var range = (maxV - minV) || 1;
    var n = actualPoints.length;
    var xScale = function (i) { return n > 1 ? padL + (i / (n - 1)) * innerW : padL + innerW / 2; };
    var yScale = function (v) { return padT + innerH - ((v - minV) / range) * innerH; };
    var svg = svgOpen(w, h);
    for (var i = 0; i <= 4; i++) {
      var gy = padT + (innerH / 4) * i;
      svg += '<line x1="' + padL + '" y1="' + gy + '" x2="' + (w - padR) + '" y2="' + gy + '" stroke="var(--grid)" stroke-width="1" />';
    }
    if (minV < 0 && maxV > 0) {
      var zy = yScale(0);
      svg += '<line x1="' + padL + '" y1="' + zy + '" x2="' + (w - padR) + '" y2="' + zy + '" stroke="var(--baseline)" stroke-width="1.5" />';
    }
    function lineFor(points, color, dash) {
      var d = points.map(function (v, i) { return (i === 0 ? "M" : "L") + xScale(i) + "," + yScale(v); }).join(" ");
      return '<path d="' + d + '" fill="none" stroke="' + color + '" stroke-width="2.5" stroke-linecap="round"' + (dash ? ' stroke-dasharray="5,4"' : '') + ' />';
    }
    svg += lineFor(cfPoints, "var(--muted)", true);
    svg += lineFor(actualPoints, "var(--accent)", false);
    cfPoints.forEach(function (v, i) { svg += '<circle cx="' + xScale(i) + '" cy="' + yScale(v) + '" r="3.5" fill="var(--muted)" />'; });
    actualPoints.forEach(function (v, i) { svg += '<circle cx="' + xScale(i) + '" cy="' + yScale(v) + '" r="4.5" fill="var(--accent)" />'; });
    for (var i2 = 0; i2 < n; i2++) {
      svg += '<text x="' + xScale(i2) + '" y="' + (h - 8) + '" font-size="10.5" text-anchor="middle" fill="var(--muted)">' + (i2 === 0 ? "Start" : fyLabel(i2)) + '</text>';
    }
    svg += "</svg>";
    return '<div class="row" style="gap:1.25rem;font-size:11.5px;color:var(--ink-2);margin-bottom:0.4rem;">' +
      '<span><svg width="14" height="10"><line x1="0" y1="5" x2="14" y2="5" stroke="var(--accent)" stroke-width="2.5"/></svg> Your actual path</span>' +
      '<span><svg width="14" height="10"><line x1="0" y1="5" x2="14" y2="5" stroke="var(--muted)" stroke-width="2.5" stroke-dasharray="4,3"/></svg> Minimum-cost compliant baseline</span>' +
    '</div>' + svg;
  }

  // Shared by Solo's Final Results and Multiplayer's shared summary screen.
  // `history` is the company's real per-year settlement records
  // (company.history); `priceHistoryArr` and `scenarioByYear` are the
  // real market conditions those years actually played out under.
  function renderDebriefSection(company, sector, history, priceHistoryArr, scenarioByYear) {
    if (!history.length) return "";
    var cf = computeComplierCounterfactual(company, sector, scenarioByYear, priceHistoryArr);
    var actualCum = 0, actualPoints = [0], cfPoints = [0];
    var rows = history.map(function (h, i) {
      actualCum += h.yearProfit;
      actualPoints.push(actualCum);
      cfPoints.push(cf[i].cumulativeProfit);
      return { year: h.year, actualProfit: h.yearProfit, cfProfit: cf[i].yearProfit };
    });
    var finalDelta = actualCum - cf[cf.length - 1].cumulativeProfit;
    var deltaGood = finalDelta >= 0;
    return '<div class="card stack">' +
      '<h3 style="margin:0;">How you compared to a minimum-cost compliant strategy</h3>' +
      '<p style="margin:0;">A same-company baseline: what a simple “commit just enough to comply” strategy — no strategic timing, no demand-chasing, running at 100% of fixed capacity — would have earned from this exact starting position, settled against the real clearing prices each year actually cleared at. An idealized comparison (assumes you could always fully trade your surplus or deficit at that price), not a full parallel simulation.</p>' +
      '<div class="kpi-row">' +
        '<div class="kpi"><span class="kv" style="color:' + (deltaGood ? "var(--good)" : "var(--critical)") + ';">' + (deltaGood ? "+" : "") + cr(finalDelta) + '</span><span class="kl">Your Cumulative Profit vs. the Baseline</span></div>' +
      '</div>' +
      '<div class="chart-card">' + debriefProfitChart(actualPoints, cfPoints) + '</div>' +
      '<div class="table-wrap"><table><thead><tr><th>Year</th><th class="num">Your Profit</th><th class="num">Baseline Profit</th><th class="num">Delta</th></tr></thead><tbody>' +
        rows.map(function (r) {
          var d = r.actualProfit - r.cfProfit;
          return '<tr><td>' + fyLabel(r.year) + '</td><td class="num">' + cr(r.actualProfit) + '</td><td class="num">' + cr(r.cfProfit) + '</td>' +
            '<td class="num" style="color:' + (d >= 0 ? "var(--good)" : "var(--critical)") + ';">' + (d >= 0 ? "+" : "") + cr(d) + '</td></tr>';
        }).join("") +
      '</tbody></table></div>' +
    '</div>';
  }

  function leaderboardChart(companies, w) {
    w = w || 520;
    var rowH = 30;
    var h = companies.length * rowH + 10;
    var padL = 4, padR = 90;
    var innerW = w - padL - padR;
    var maxAbs = Math.max.apply(null, companies.map(function (c) { return Math.abs(c.totalProfit); })) || 1;
    var svg = svgOpen(w, h);
    companies.forEach(function (c, i) {
      var y = i * rowH + 6;
      var barW = (Math.abs(c.totalProfit) / maxAbs) * (innerW * 0.55);
      var lastRec = c.history[c.history.length - 1];
      var compliant = lastRec ? lastRec.penalty <= 0.01 : true;
      var color = c.totalProfit < 0 ? "var(--critical)" : (compliant ? "var(--good)" : "var(--warning)");
      svg += '<text x="' + padL + '" y="' + (y + 14) + '" font-size="12" fill="var(--ink)" font-weight="' + (c.isPlayer ? 700 : 500) + '">' + (c.isPlayer ? "★ " : "") + escapeHtml(c.sectorName) + '</text>';
      svg += '<rect x="' + (w - padR) + '" y="' + (y + 3) + '" width="' + Math.max(2, barW) + '" height="16" rx="3" fill="' + color + '" opacity="' + (c.isPlayer ? 1 : 0.72) + '" />';
      svg += '<text x="' + (w - padR + Math.max(2, barW) + 8) + '" y="' + (y + 15) + '" font-size="11" fill="var(--ink-2)" font-family="var(--mono)">' + cr(c.totalProfit) + '</text>';
    });
    svg += "</svg>";
    return svg;
  }

  function previewProductionStats(company, sector, level, scenario) {
    var actualOutput = company.output * level;
    var demandMult = scenario.demand[sector.id];
    var ceiling = company.output * demandMult;
    var sellableFull = Math.min(actualOutput, ceiling);
    var excess = Math.max(0, actualOutput - sellableFull);
    var revenue = company.margin * sellableFull + company.margin * 0.4 * excess;
    return { actualOutput: actualOutput, ceiling: ceiling, revenue: revenue, oversupplied: excess > 0 };
  }

  // Shared by Solo and Multiplayer's live abatement-screen preview, and by
  // the actual settlement math in engine.js's resolveTrading — kept as a
  // single implementation so the number a player previews before locking in
  // their plan always matches what settlement actually charges them.
  function previewCbamStats(company, sector, actualIntensity, actualOutput, euShare, verify, year, priceGuess, article9Recognized) {
    if (!cbamEligible(sector.id)) return null;
    var euOutput = actualOutput * euShare;
    var intensity = verify ? actualIntensity : company.baselineIntensity * CBAM_DEFAULT_VALUE_MARKUP;
    var embeddedEmissions = intensity * euOutput;
    var fraction = cbamObligationFraction(year);
    var certificates = embeddedEmissions * fraction;
    var price = euEtsPrice(year);
    var deductible = article9Recognized ? Math.min(price, priceGuess) : 0;
    var cost = Math.max(0, certificates * (price - deductible));
    return {
      euOutput: euOutput, embeddedEmissions: embeddedEmissions, certificates: certificates,
      euEtsPrice: price, deductible: deductible, cbamCost: cost,
      verificationCost: verify ? CBAM_VERIFICATION_COST : 0
    };
  }

  // `previewCount` is what the slider would commit if locked in right now (>= p.activatedCount).
  // Already-committed measures keep their real commitYear/lead time; a newly-previewed
  // measure is evaluated as if it committed this year, so a 0-lead measure shows as
  // immediately active in the preview while a multi-year one shows its real ETA.
  function previewEffectiveCount(p, previewCount, year) {
    var n = 0;
    for (var i = 0; i < previewCount; i++) {
      var cy = i < p.activatedCount ? p.commitYear[i] : year;
      if (year >= cy + MEASURE_LEAD_TIMES[i]) n++;
      else break;
    }
    return n;
  }

  function measureRows(p, previewCount, year) {
    return p.measures.map(function (m, i) {
      var lead = MEASURE_LEAD_TIMES[i];
      var committed = i < p.activatedCount;
      var previewed = !committed && i < previewCount;
      var effYear = committed ? p.commitYear[i] + lead : year + lead;
      var isActiveNow = committed && year >= effYear;
      var rowClass = "", pillClass = "pill-idle", label = "Idle";
      if (isActiveNow) {
        rowClass = "active"; pillClass = "pill-good"; label = "Active";
      } else if (committed) {
        rowClass = "pending"; pillClass = "pill-warn"; label = "Pending — effective " + fyLabel(effYear);
      } else if (previewed) {
        rowClass = "pending"; pillClass = "pill-warn";
        label = lead > 0 ? "Will commit — effective " + fyLabel(effYear) : "Will commit — active this year";
      }
      var leadNote = lead > 0 ? " · " + lead + "-yr lead time" : " · same-year effect";
      return '<div class="measure-row' + (rowClass ? " " + rowClass : "") + '">' +
        '<div><div class="m-name">' + (i + 1) + '. ' + m.label + '</div>' +
        '<div class="m-meta">' + num2.format(m.reductionPerUnit) + ' tCO2e/unit cut · ' + rupee(m.costPerTonne) + '/tCO2e' + leadNote + '</div></div>' +
        '<span class="pill ' + pillClass + '">' + label + '</span>' +
      '</div>';
    }).join("");
  }

  function renderSummary() {
    var p = player();
    var ranked = G.companies.slice().sort(function (a, b) { return b.totalProfit - a.totalProfit; });
    var rank = ranked.indexOf(p) + 1;
    var allCompliant = p.history.every(function (h) { return h.penalty <= 0.01; });
    var marketAbatement = G.companies.reduce(function (s, c) {
      var sec = sectorById(c.sectorId);
      var t = targetIntensity(c, sec, TOTAL_YEARS);
      return s + (c.baselineIntensity - t) * c.output;
    }, 0);
    var actualAbatement = G.companies.reduce(function (s, c) {
      return s + cumulativeReduction(c, effectiveCount(c, TOTAL_YEARS)) * c.output;
    }, 0);
    var scenarioByYear = [];
    for (var sy = 1; sy <= TOTAL_YEARS; sy++) scenarioByYear.push(G.yearData[sy] ? G.yearData[sy].scenario : null);
    var html = '<div class="wrap stack">' +
      '<div class="eyebrow">Compliance period closed · ' + fyLabel(1) + ' – ' + fyLabel(TOTAL_YEARS) + '</div>' +

        '<div class="card" style="flex:1;min-width:200px;"><div class="kpi"><span class="kv">' + cr(p.totalProfit) + '</span><span class="kl">Cumulative Profit</span></div></div>' +
        '<div class="card" style="flex:1;min-width:200px;"><div class="kpi"><span class="kv" style="color:' + (allCompliant ? "var(--good)" : "var(--critical)") + '">' + (allCompliant ? "Fully Compliant" : "Penalized") + '</span><span class="kl">' + TOTAL_YEARS + '-Year Record</span></div></div>' +
      '</div>' +
      '<div class="row" style="align-items:flex-start;">' +
        '<div class="chart-card" style="flex:1;min-width:320px;"><h3 style="margin-top:0;">CCC clearing price by period</h3>' + priceTrajectoryChart() + '</div>' +
        '<div class="card" style="flex:1;min-width:320px;"><h3 style="margin-top:0;">Nine-operator leaderboard</h3>' + leaderboardChart(ranked) + '</div>' +
      '</div>' +
      '<div class="card"><h3 style="margin-top:0;">Market-wide abatement</h3>' +
        '<p>Across all nine simulated operators, ' + fyLabel(TOTAL_YEARS) + ' intensity targets implied ' + moneyInt.format(Math.round(marketAbatement)) + ' tCO2e/yr of required abatement versus baseline. The market actually delivered ' + moneyInt.format(Math.round(actualAbatement)) + ' tCO2e/yr (' + pct(marketAbatement ? (actualAbatement / marketAbatement) * 100 : 0) + ' of the required cut) once trading, banking, penalties and investment lead times settled.</p>' +
      '</div>' +
      renderDebriefSection(p, sectorById(p.sectorId), p.history, G.priceHistory, scenarioByYear) +
      '<div class="row" style="justify-content:flex-end;"><button class="btn" data-action="restart">Register a New Company →</button></div>' +
      '<p class="foot-note">Modeled on the CCTS as notified through February 2026. Sector baselines, abatement costs, output volumes and company financials are illustrative approximations for gameplay, not official BEE/CERC figures.</p>' +
    '</div>';

  }

  /* ---------- render: market simulator ---------- */

  function weightPct(weights, i) {
    var total = weights.reduce(function (s, w) { return s + w; }, 0);

  function renderSimRunning() {
    var cfg = G.simConfig;
    return '<div class="wrap-narrow stack" style="text-align:center;padding-top:3rem;">' +
      '<div class="eyebrow">Market Simulator</div>' +
      '<h2>Running ' + cfg.trials + ' trials…</h2>' +

  }

  function bandPriceChart(years, w) {
    w = w || 560;
    var h = 220;
    var padL = 56, padR = 20, padT = 32, padB = 46;
    var innerW = w - padL - padR, innerH = h - padT - padB;
    var maxP = Math.max(PRICE_CEIL, 1) * 1.05, minP = 0;
    var xScale = function (i) { return years.length > 1 ? padL + (i / (years.length - 1)) * innerW : padL + innerW / 2; };
    var yScale = function (p) { return padT + innerH - ((p - minP) / (maxP - minP)) * innerH; };
    var svg = svgOpen(w, h);
    for (var i = 0; i <= 4; i++) {
      var gy = padT + (innerH / 4) * i;
      svg += '<line x1="' + padL + '" y1="' + gy + '" x2="' + (w - padR) + '" y2="' + gy + '" stroke="var(--grid)" stroke-width="1" />';
    }
    var bandPath = "M" + xScale(0) + "," + yScale(years[0].priceP10);
    years.forEach(function (y, idx) { bandPath += " L" + xScale(idx) + "," + yScale(y.priceP10); });
    for (i = years.length - 1; i >= 0; i--) bandPath += " L" + xScale(i) + "," + yScale(years[i].priceP90);
    bandPath += " Z";
    svg += '<path d="' + bandPath + '" fill="var(--price)" opacity="0.14" />';
    var line = years.map(function (y, idx) { return (idx === 0 ? "M" : "L") + xScale(idx) + "," + yScale(y.priceMedian); }).join(" ");
    svg += '<path d="' + line + '" fill="none" stroke="var(--price)" stroke-width="2.5" stroke-linecap="round" />';
    years.forEach(function (y, idx) {
      svg += '<circle cx="' + xScale(idx) + '" cy="' + yScale(y.priceMedian) + '" r="4.5" fill="var(--price)" />';
      // Anchored to the band's own top/bottom (not the median dot) so the two labels
      // stay clear of each other even when P10-P90 collapses to a near-zero-width band.
      svg += '<text x="' + xScale(idx) + '" y="' + (yScale(y.priceP90) - 12) + '" font-size="11.5" text-anchor="middle" font-weight="700" fill="var(--ink)">₹' + moneyInt.format(Math.round(y.priceMedian)) + ' median</text>';
      svg += '<text x="' + xScale(idx) + '" y="' + (yScale(y.priceP10) + 18) + '" font-size="10" text-anchor="middle" fill="var(--muted)">P10 ₹' + moneyInt.format(Math.round(y.priceP10)) + ' – P90 ₹' + moneyInt.format(Math.round(y.priceP90)) + '</text>';
      svg += '<text x="' + xScale(idx) + '" y="' + (h - 8) + '" font-size="10.5" text-anchor="middle" fill="var(--muted)">FY 20' + (24 + y.year) + '-' + (25 + y.year) + '</text>';
    });
    svg += '<text x="' + padL + '" y="' + (padT - 6) + '" font-size="10" fill="var(--muted)">₹/tCO2e</text>';
    svg += "</svg>";
    return svg;
  }

  function coverageBar(y, w) {
    w = w || 520;
    var h = 40;
    var gap = 2;
    var padL = 4, padR = 4;
    var innerW = w - padL - padR - gap * 2;
    var total = y.bankShare + y.marketShare + y.penaltyShare || 1;
    var bw = (y.bankShare / total) * innerW, mw = (y.marketShare / total) * innerW, pw = (y.penaltyShare / total) * innerW;
    var svg = svgOpen(w, h);
    var x = padL;
    if (bw > 0) { svg += '<rect x="' + x + '" y="6" width="' + bw + '" height="20" rx="3" fill="var(--good)" />'; x += bw + gap; }
    if (mw > 0) { svg += '<rect x="' + x + '" y="6" width="' + mw + '" height="20" rx="3" fill="var(--price)" />'; x += mw + gap; }
    if (pw > 0) { svg += '<rect x="' + x + '" y="6" width="' + pw + '" height="20" rx="3" fill="var(--critical)" />'; }
    svg += "</svg>";
    return '<div>' +
      '<div style="font-size:12px;color:var(--ink-2);margin-bottom:0.3rem;">FY 20' + (24 + y.year) + '-' + (25 + y.year) + '</div>' +
      svg +
      '<div class="row" style="gap:1.1rem;font-size:11.5px;color:var(--ink-2);margin-top:0.35rem;">' +
        '<span><svg width="10" height="10"><rect width="10" height="10" rx="2" fill="var(--good)"/></svg> Bank draw ' + num2.format(y.bankShare) + '%</span>' +
        '<span><svg width="10" height="10"><rect width="10" height="10" rx="2" fill="var(--price)"/></svg> Bought on exchange ' + num2.format(y.marketShare) + '%</span>' +
        '<span><svg width="10" height="10"><rect width="10" height="10" rx="2" fill="var(--critical)"/></svg> Penalized ' + num2.format(y.penaltyShare) + '%</span>' +
      '</div>' +
    '</div>';
  }

  function complianceStatColor(rate) { return rate >= 80 ? "var(--good)" : rate >= 50 ? "var(--warning)" : "var(--critical)"; }

  function renderSimResults() {
    var res = G.simResult;
    var cfg = G.simConfig;
    var html = '<div class="wrap stack">' +
      '<div class="eyebrow">Market Simulator · ' + res.trials + ' trials · ' + moneyInt.format(cfg.firmsPerSector * SECTORS.length) + ' operators/trial</div>' +
      '<h1>Forecast results</h1>' +

      '<div class="chart-card"><h3 style="margin-top:0;">CCC clearing price — median, with 10th–90th percentile band</h3>' + bandPriceChart(res.years) + '</div>' +

      '<div class="row">' +
        res.years.map(function (y) {
          return '<div class="card" style="flex:1;min-width:220px;"><div class="kpi">' +
            '<span class="kv" style="color:' + complianceStatColor(y.complianceMean) + '">' + num2.format(y.complianceMean) + '%</span>' +
            '<span class="kl">FY 20' + (24 + y.year) + '-' + (25 + y.year) + ' Compliance Rate</span></div></div>';
        }).join("") +
        res.years.map(function (y) {
          var ratio = y.requiredAbatement ? (y.actualAbatement / y.requiredAbatement) * 100 : 0;
          return '<div class="card" style="flex:1;min-width:220px;"><div class="kpi">' +
            '<span class="kv">' + num2.format(ratio) + '%</span>' +
            '<span class="kl">FY 20' + (24 + y.year) + '-' + (25 + y.year) + ' Abatement Delivered vs. Required</span></div></div>';
        }).join("") +
      '</div>' +

      '<div class="card stack"><h3 style="margin:0;">How covered shortfalls were closed</h3>' +
        '<p style="margin:0;">Of all deficit tonnes across every simulated operator, the share resolved by drawing the bank, buying on the exchange, or absorbing the 2× penalty.</p>' +
        '<div class="row" style="gap:2rem;flex-wrap:wrap;">' + res.years.map(function (y) { return '<div style="flex:1;min-width:240px;">' + coverageBar(y) + '</div>'; }).join("") + '</div>' +
      '</div>' +

      (cfg.cbamEnabled ? '<div class="card stack"><h3 style="margin:0;">CBAM: EU border adjustment (optional module)</h3>' +
        '<p style="margin:0;">Aggregate CBAM exposure across every eligible (Aluminium, Iron &amp; Steel, Cement, Fertilizer) simulated operator that chose a non-zero EU export share this year, under Article 9 ' + (cfg.cbamArticle9Recognized ? "recognized" : "not recognized") + '.</p>' +
        '<div class="row">' + res.years.map(function (y) {
          return '<div class="card" style="flex:1;min-width:220px;"><div class="kpi">' +
            '<span class="kv" style="color:var(--critical);">' + cr(y.cbamCost) + '</span>' +
            '<span class="kl">FY 20' + (24 + y.year) + '-' + (25 + y.year) + ' Avg. CBAM Cost</span></div></div>';
        }).join("") + '</div>' +
        '<div class="row">' + res.years.map(function (y) {
          return '<div class="card" style="flex:1;min-width:220px;"><div class="kpi">' +
            '<span class="kv">' + moneyInt.format(Math.round(y.cbamExposedCount)) + '</span>' +
            '<span class="kl">FY 20' + (24 + y.year) + '-' + (25 + y.year) + ' EU-Exposed Operators (avg./trial)</span></div></div>';
        }).join("") + '</div>' +
      '</div>' : "") +

      '<div class="card"><h3 style="margin-top:0;">Sector breakdown</h3>' +
      '<div class="table-wrap"><table><thead><tr><th>Sector</th>' +
        res.years.map(function (y) { return '<th class="num">FY' + (25 + y.year) + ' Compliant</th>'; }).join("") +
        res.years.map(function (y) { return '<th class="num">FY' + (25 + y.year) + ' Abatement</th>'; }).join("") +
      '</tr></thead><tbody>' +
        SECTORS.map(function (s) {
          var complianceCells = res.years.map(function (y) {
            var ss = y.sectorAgg[s.id];
            var c = ss.total ? (ss.compliant / ss.total) * 100 : 0;
            return '<td class="num" style="color:' + complianceStatColor(c) + '">' + num2.format(c) + '%</td>';
          }).join("");
          var abateCells = res.years.map(function (y) {
            var ss = y.sectorAgg[s.id];
            var a = ss.requiredCut ? (ss.actualCut / ss.requiredCut) * 100 : 0;
            return '<td class="num">' + num2.format(a) + '%</td>';
          }).join("");
          return '<tr><td><strong>' + s.name + '</strong></td>' + complianceCells + abateCells + '</tr>';
        }).join("") +
      '</tbody></table></div></div>' +

      '<div class="row" style="justify-content:space-between;">' +
        '<button class="btn btn-ghost" data-action="goto-simsetup">← Adjust Parameters</button>' +
        '<button class="btn" data-action="run-simulation">Run Again →</button>' +
      '</div>' +
      '<p class="foot-note">Every trial regenerates a fresh, randomized population of firms from the configured weights — re-running with identical settings will produce a similar but not identical forecast. Widen the trial count to narrow that variance.</p>' +
    '</div>';
    return html;
  }

        ? '<div class="row" style="gap:0.6rem;">' +

                  '<button class="btn btn-sm' + (!cfg.article9Recognized ? "" : " btn-ghost") + '" data-action="mp-cbam-article9-toggle" data-id="off"' + (MP.busy ? " disabled" : "") + '>Not recognized</button>' +

              '</div>'

  function renderMpLobby() {

      '</div>' +
      '<div class="stack">' +
        '<h2>Lobby</h2>' +

        mpCbamLobbyCard(isHost) +
        (MP.mySeat ? "" :

            '<h3 style="margin:0;">Claim a seat</h3>' +

  function mpStepsBar(current) {
    var order = ["briefing", "abatement", "trading", "settlement"];

    var idx = order.indexOf(current);
    return '<div class="steps">' + order.map(function (s, i) {
      var cls = i === idx ? "on" : (i < idx ? "done" : "");
      return '<span class="step ' + cls + '">' + (i + 1) + "  " + labels[s] + '</span>';
    }).join("") + '</div>';
  }

  function mpHeader() {
    var yearLabel = fyLabel(MP.state.year);

  function renderMpAbatement() {
    var mine = mpMyCompany();
    if (!mine) {
      return '<div class="wrap grid-2"><div class="stack">' + mpRoster("abatement") + '</div><div class="stack">' + mpStepsBar("abatement") + mpHeader() + '<div class="card"><p style="margin:0;">Spectating — waiting for operators to plan their abatement.</p></div>' + '<div class="row" style="justify-content:flex-end;">' + mpAdvanceControl("Open Exchange →") + '</div></div></div>';
    }
    if (MP.abateDraftYear !== MP.state.year) { MP.abateDraft = mine.activatedCount; MP.abateDraftYear = MP.state.year; }
    var sector = sectorById(mine.sectorId);
    var yd = MP.state.yearData[MP.state.year] || {};
    if (MP.productionDraftYear !== MP.state.year) {
      MP.productionDraft = yd.scenario ? Math.round(yd.scenario.demand[sector.id] * 20) / 20 : 1;
      MP.productionDraftYear = MP.state.year;
    }
    if (MP.cbamDraftYear !== MP.state.year) {
      var cbamCfgForDefault = MP.state.cbamConfig || { enabled: false };
      MP.cbamDraft = { euShare: cbamCfgForDefault.enabled && cbamEligible(sector.id) ? 0.15 : 0, verify: true };
      MP.cbamDraftYear = MP.state.year;
    }
    var target = targetIntensity(mine, sector, MP.state.year);
    var alreadySubmitted = MP.state.submissions.abatement[MP.mySeat] != null;
    var count = alreadySubmitted ? MP.state.submissions.abatement[MP.mySeat] : MP.abateDraft;
    var prodSubmitted = MP.state.submissions.production[MP.mySeat];
    var prodLevel = prodSubmitted != null ? prodSubmitted : MP.productionDraft;
    var cbamSubmitted = MP.state.submissions.cbam[MP.mySeat];
    var cbamDraft = cbamSubmitted != null ? { euShare: cbamSubmitted.euShare, verify: cbamSubmitted.verify } : MP.cbamDraft;
    var effCount = previewEffectiveCount(mine, count, MP.state.year);
    var reduced = cumulativeReduction(mine, effCount);
    var actual = mine.baselineIntensity - reduced;
    var capex = newMeasuresCost(mine, mine.activatedCount, count);
    var prodStats = yd.scenario ? previewProductionStats(mine, sector, prodLevel, yd.scenario) : null;
    var mpPriceGuess = MP.state.priceHistory.length ? MP.state.priceHistory[MP.state.priceHistory.length - 1].price : (PRICE_FLOOR + PRICE_CEIL) / 2;
    var cbamCfg = MP.state.cbamConfig || { enabled: false, article9Recognized: false };
    var html = '<div class="wrap grid-2">' +
      '<div class="stack">' + mpRoster("abatement") + '</div>' +
      '<div class="stack">' +
        mpStepsBar("abatement") + mpHeader() +
        '<h2>Production &amp; abatement plan</h2>' +
        mpErrorBanner() +
        (yd.scenario ? renderScenarioCard(yd.scenario, mine.sectorId) : "") +
        (prodStats ? '<div class="card stack">' +
          '<h3 style="margin:0;">Production planning</h3>' +
          '<p style="margin:0;">Capacity is fixed — this year\'s call is how much of it to run given the outlook above.</p>' +
          '<input type="range" min="70" max="130" step="5" value="' + Math.round(prodLevel * 100) + '" id="mp-production-slider" />' +
          '<div class="row" style="justify-content:space-between;">' +
            '<div class="kpi"><span class="kv" id="mp-production-level">' + Math.round(prodLevel * 100) + '%</span><span class="kl">Production Level</span></div>' +
            '<div class="kpi"><span class="kv" id="mp-production-output">' + moneyInt.format(Math.round(prodStats.actualOutput)) + '</span><span class="kl">Actual Output</span></div>' +
            '<div class="kpi"><span class="kv" id="mp-production-revenue" style="color:' + (prodStats.oversupplied ? "var(--warning)" : "var(--ink)") + '">' + cr(prodStats.revenue) + '</span><span class="kl">Projected Revenue</span></div>' +
          '</div>' +
          '<p class="muted" id="mp-production-note" style="margin:0;">' + (prodStats.oversupplied
            ? "Producing above the demand ceiling (" + moneyInt.format(Math.round(prodStats.ceiling)) + ") — the excess sells at a discount."
            : "Within this year's demand ceiling (" + moneyInt.format(Math.round(prodStats.ceiling)) + ") — full-price revenue on all of it.") + '</p>' +
        '</div>' : "") +
        '<h3 style="margin-bottom:0;">Abatement measures</h3>' +
        '<p style="margin-top:0.2rem;">Bigger measures take a year or more of lead time before they actually cut emissions — the intensity below only counts what\'s really in effect this period.</p>' +
        '<div class="chart-card">' + bulletChart(actual, target, mine.baselineIntensity) + '</div>' +
        '<div class="card stack" id="mp-measure-list">' + measureRows(mine, count, MP.state.year) + '</div>' +
        (alreadySubmitted
          ? '<div class="card"><p style="margin:0;">Submitted — ' + count + ' measure(s) committed, production ' + Math.round((prodSubmitted != null ? prodSubmitted : 1) * 100) + '%. You can still change this until the host advances.</p></div>'
          : "") +
        '<input type="range" min="0" max="4" step="1" value="' + count + '" id="mp-abate-slider" />' +
        '<div class="row" style="justify-content:space-between;">' +
          '<div class="kpi"><span class="kv" id="mp-abate-capex">' + capexLabel(capex) + '</span><span class="kl">Capex This Period</span></div>' +
          '<div class="kpi"><span class="kv" id="mp-abate-intensity" style="color:' + (actual <= target ? "var(--good)" : "var(--critical)") + '">' + num2.format(actual) + '</span><span class="kl">Resulting Intensity</span></div>' +
        '</div>' +
        cbamAbatementCard(mine, sector, actual, prodStats ? prodStats.actualOutput : mine.output, cbamDraft, MP.state.year, cbamCfg, "mp-cbam", mpPriceGuess) +
        '<div class="row" style="justify-content:space-between;">' +
          '<button class="btn btn-ghost" data-action="mp-submit-abatement"' + (MP.busy ? " disabled" : "") + '>' + (alreadySubmitted ? "Update Submission" : "Submit Plan") + '</button>' +
          mpAdvanceControl("Open Exchange →") +
        '</div>' +
      '</div>' +
    '</div>';
    return html;
  }

  function renderMpTrading() {
    var mine = mpMyCompany();
    var yd = MP.state.yearData[MP.state.year] || {};
    if (!mine) {
      return '<div class="wrap grid-2"><div class="stack">' + mpRoster("trading") + '</div><div class="stack">' + mpStepsBar("trading") + mpHeader() + '<div class="card"><p style="margin:0;">Spectating — waiting for operators to trade.</p></div>' + '<div class="row" style="justify-content:flex-end;">' + mpAdvanceControl("Settle →") + '</div></div></div>';
    }
    var ab = yd.abate ? yd.abate[MP.mySeat] : null;
    if (!ab) return '<div class="wrap"><p>Waiting for abatement to resolve…</p></div>';
    if (MP.tradeDraftYear !== MP.state.year) { MP.tradeDraft = { qty: 0, limitPrice: PRICE_FLOOR }; MP.tradeDraftYear = MP.state.year; }
    var sd = ab.surplusDeficit;
    var isSeller = sd >= 0;
    var maxQty = isSeller ? Math.max(0, sd) : Math.max(0, -sd - mine.bank);
    var already = MP.state.submissions.trading[MP.mySeat];
    var priceGuess = MP.state.priceHistory.length ? MP.state.priceHistory[MP.state.priceHistory.length - 1].price : (PRICE_FLOOR + PRICE_CEIL) / 2;
    var html = '<div class="wrap grid-2">' +
      '<div class="stack">' + mpRoster("trading") +
        '<div class="card"><h3 style="margin-top:0;">Your position</h3><div class="kpi-row">' +
          '<div class="kpi"><span class="kv">' + num2.format(Math.abs(sd)) + '</span><span class="kl">tCO2e ' + (isSeller ? "Surplus" : "Deficit") + '</span></div>' +
          '<div class="kpi"><span class="kv">' + moneyInt.format(Math.round(mine.bank)) + '</span><span class="kl">Bank</span></div>' +

      '</div>' +

        mpErrorBanner() +
        '<div class="card stack">' +
          '<div class="row">' +
            '<label class="field" style="flex:1;">Quantity to ' + (isSeller ? "sell" : "buy") + ' (of ' + moneyInt.format(Math.round(maxQty)) + ')' +
              '<input type="number" id="mp-trade-qty" min="0" max="' + Math.round(maxQty) + '" value="' + Math.round(already ? already.qty : MP.tradeDraft.qty) + '" /></label>' +
            '<label class="field" style="flex:1;">' + (isSeller ? "Minimum price" : "Maximum price") + ' (₹/tCO2e)' +
              '<input type="number" id="mp-trade-price" min="' + PRICE_FLOOR + '" max="' + PRICE_CEIL + '" value="' + Math.round(already ? already.limitPrice : MP.tradeDraft.limitPrice) + '" /></label>' +
          '</div>' +
          '<p class="muted" style="margin:0;">Reference price: ' + rupee(priceGuess) + '/tCO2e.' + (already ? " Submitted — you can still update until the host advances." : "") + '</p>' +
        '</div>' +
        '<div class="row" style="justify-content:space-between;">' +
          '<button class="btn btn-ghost" data-action="mp-submit-order"' + (MP.busy ? " disabled" : "") + '>' + (already ? "Update Order" : "Submit Order") + '</button>' +
          mpAdvanceControl("Settle →") +
        '</div>' +
      '</div>' +
    '</div>';
    return html;
  }

    var mine = mpMyCompany();
    var yd = MP.state.yearData[MP.state.year] || {};
    var ranked = Object.keys(MP.state.companies).map(function (id) { return MP.state.companies[id]; }).sort(function (a, b) { return b.totalProfit - a.totalProfit; });

      '<div class="stack">' +

        '<h2>Settlement</h2>' +
        mpErrorBanner() +
        (yd.auction ? '<div class="chart-card"><h3 style="margin-top:0;">Auction crossing</h3>' + crossingChart(yd.auction) + '</div>' : "") +
        (rec ? '<div class="card stack">' +
          '<div class="row" style="justify-content:space-between;align-items:center;">' +
            '<span class="pill ' + (rec.penalty > 0.01 ? "pill-bad" : "pill-good") + '">' + (rec.penalty > 0.01 ? "Non-compliant" : "Compliant") + '</span>' +

            settleRow("Surplus / (deficit)", num2.format(rec.surplusDeficit) + " tCO2e") +

        '<div class="card" style="flex:1;min-width:200px;"><div class="kpi"><span class="kv">' + cr(mine.totalProfit) + '</span><span class="kl">Your Cumulative Profit</span></div></div>' +

      '<div class="row" style="align-items:flex-start;">' +
        '<div class="chart-card" style="flex:1;min-width:320px;"><h3 style="margin-top:0;">CCC clearing price by period</h3>' + priceTrajectoryChart(520, MP.state.priceHistory) + '</div>' +
        '<div class="card" style="flex:1;min-width:320px;"><h3 style="margin-top:0;">Nine-operator leaderboard</h3>' + leaderboardChart(ranked) + '</div>' +
      '</div>' +

  function facPhasePill(phase) {
    var map = {
      lobby: { cls: "pill-idle", label: "Lobby" },
      briefing: { cls: "pill-warn", label: "Briefing" },
      abatement: { cls: "pill-warn", label: "Abatement" },
      trading: { cls: "pill-warn", label: "Trading" },
      settlement: { cls: "pill-warn", label: "Settlement" },
      summary: { cls: "pill-good", label: "Complete" }
    };
    var m = map[phase] || { cls: "pill-idle", label: phase || "—" };
    return '<span class="pill ' + m.cls + '">' + m.label + '</span>';
  }

  function facRoomSubline(state) {
    if (!state) return "Loading…";
    var claimed = SECTORS.filter(function (s) { return state.seats[s.id].claimedBy; }).length;
    var line = claimed + " of 9 seats claimed";
    var subs = state.submissions || { abatement: {}, trading: {} };
    if (state.phase === "abatement" || state.phase === "trading") {
      var need = SECTORS.filter(function (s) { return state.seats[s.id].claimedBy; }).length;
      var got = SECTORS.filter(function (s) {
        if (!state.seats[s.id].claimedBy) return false;
        return state.phase === "abatement" ? subs.abatement[s.id] != null : !!subs.trading[s.id];
      }).length;
      line += " · " + got + "/" + need + " submitted";
    } else if (state.phase !== "lobby") {
      line += " · Year " + state.year + " of " + TOTAL_YEARS;
    }
    return line;
  }

  function renderFacDashboard() {
    var anyLobby = FAC.rooms.some(function (r) { return r.state && r.state.phase === "lobby"; });
    var firstCbam = (FAC.rooms[0] && FAC.rooms[0].state && FAC.rooms[0].state.cbamConfig) || { enabled: false, article9Recognized: false };
    return '<div class="wrap stack">' +
      '<div class="eyebrow">Facilitator Dashboard</div>' +
      '<h2>' + (FAC.label ? escapeHtml(FAC.label) : "Training Session") + '</h2>' +
      facErrorBanner() +
      '<div class="card stack">' +
        '<div class="row" style="justify-content:space-between;flex-wrap:wrap;gap:0.75rem;">' +
          '<div><div class="muted" style="font-size:12px;">Facilitator code</div><div class="code-display">' + FAC.code + '</div></div>' +
          '<div><div class="muted" style="font-size:12px;">Facilitator token — save this to reconnect later</div><div style="font-family:var(--mono);font-size:13px;word-break:break-all;">' + escapeHtml(FAC.token || "") + '</div></div>' +
        '</div>' +
        '<p class="muted" style="margin:0;">Share each room\'s 4-letter code below with that breakout group — they join at the Live Multiplayer screen exactly as normal.</p>' +
      '</div>' +
      cbamSetupCard(firstCbam, "fac-cbam-toggle", "fac-cbam-article9-toggle") +
      '<div class="row" style="justify-content:flex-end;gap:0.6rem;flex-wrap:wrap;">' +
        (anyLobby ? '<button class="btn" data-action="fac-start-all"' + (FAC.busy ? " disabled" : "") + '>Start All Rooms →</button>' : "") +
        '<button class="btn' + (anyLobby ? " btn-ghost" : "") + '" data-action="fac-advance-all"' + (FAC.busy ? " disabled" : "") + '>Advance All Rooms →</button>' +
      '</div>' +
      '<div class="stack" style="gap:0.6rem;">' +
        FAC.rooms.map(function (r) {
          var st = r.state;
          return '<div class="card">' +
            '<div class="row" style="justify-content:space-between;align-items:center;flex-wrap:wrap;gap:0.6rem;">' +
              '<div>' +
                '<div style="font-family:var(--mono);font-size:1.1rem;font-weight:700;letter-spacing:0.05em;">' + r.code + '</div>' +
                '<div class="muted" style="font-size:12.5px;">' + facRoomSubline(st) + '</div>' +
              '</div>' +
              '<div class="row" style="gap:0.6rem;align-items:center;">' +
                facPhasePill(st ? st.phase : null) +
                (st && st.phase !== "lobby" && st.phase !== "summary"
                  ? '<button class="btn btn-sm btn-ghost" data-action="fac-advance-one" data-id="' + r.code + '"' + (FAC.busy ? " disabled" : "") + '>Advance →</button>'
                  : "") +
              '</div>' +
            '</div>' +
          '</div>';
        }).join("") +
      '</div>' +
      '<div class="row" style="justify-content:flex-start;">' +
        '<button class="btn btn-ghost" data-action="fac-leave">← Leave dashboard</button>' +
      '</div>' +
    '</div>';
  }

  /* ---------- events ---------- */

  function bindEvents() {
    var app = document.getElementById("app");
    app.onclick = function (e) {
      var el = e.target.closest("[data-action]");
      if (!el) return;
      var action = el.getAttribute("data-action");
      if (action === "goto-setup") { G.screen = "setup"; render(); }
      else if (action === "start-tutorial") { tutorialStart(); G.screen = "setup"; render(); }
      else if (action === "dismiss-tutorial-offer") { tutorialStorageSet("cctsTutorialOffered", "1"); render(); }
      else if (action === "tutorial-next") { tutorialAdvance(); render(); }
      else if (action === "tutorial-skip") { tutorialEnd(); render(); }
      else if (action === "back-landing") { G.screen = "landing"; render(); }
      else if (action === "pick-sector") { G.draft.sectorId = el.getAttribute("data-id"); render(); }
      else if (action === "pick-archetype") { G.draft.archetypeId = el.getAttribute("data-id"); render(); }
      else if (action === "start-game") { startGame(); }
      else if (action === "goto-abatement") { beginAbatement(); }
      else if (action === "confirm-abatement") { confirmAbatement(); }
      else if (action === "submit-trading") { submitTrading(); }
      else if (action === "next-year") { nextYear(); }
      else if (action === "restart") { restart(); }
      else if (action === "goto-simsetup") { goToSimSetup(); }
      else if (action === "run-simulation") { launchSimulation(); }
      else if (action === "pick-variance") { G.simConfig.varianceLabel = el.getAttribute("data-id"); render(); }
      else if (action === "cbam-toggle") { G.cbamConfig.enabled = el.getAttribute("data-id") === "on"; render(); }
      else if (action === "cbam-article9-toggle") { G.cbamConfig.article9Recognized = el.getAttribute("data-id") === "on"; render(); }
      else if (action === "sim-cbam-toggle") { G.simConfig.cbamEnabled = el.getAttribute("data-id") === "on"; render(); }
      else if (action === "sim-cbam-article9-toggle") { G.simConfig.cbamArticle9Recognized = el.getAttribute("data-id") === "on"; render(); }
      else if (action === "goto-mp") { mpReset(); G.screen = "mp"; render(); }
      else if (action === "mp-create") { mpCreateRoom(); }
      else if (action === "mp-join-lookup") {
        var codeEl = document.getElementById("mp-code-input");
        if (codeEl) MP.joinDraft.code = codeEl.value;
        mpJoinRoomLookup();
      }
      else if (action === "mp-rejoin-last") {
        var lastCode = null;
        try { lastCode = sessionStorage.getItem("cctsMpLast"); } catch (err) {}
        if (lastCode) { MP.joinDraft.code = lastCode; mpJoinRoomLookup(); }
      }
      else if (action === "mp-pick-archetype") { MP.seatDraft.archetypeId = el.getAttribute("data-id"); render(); }
      else if (action === "mp-claim-seat") {
        var nameEl = document.getElementById("mp-name-input");
        if (nameEl) MP.seatDraft.name = nameEl.value;
        mpClaimSeat(el.getAttribute("data-id"));
      }
      else if (action === "mp-start-game") { mpStartGame(); }
      else if (action === "mp-cbam-toggle") {
        var curCfg = MP.state.cbamConfig || { enabled: false, article9Recognized: false };
        mpSetCbamConfig(el.getAttribute("data-id") === "on", curCfg.article9Recognized);
      }
      else if (action === "mp-cbam-article9-toggle") {
        var curCfg2 = MP.state.cbamConfig || { enabled: false, article9Recognized: false };
        mpSetCbamConfig(curCfg2.enabled, el.getAttribute("data-id") === "on");
      }
      else if (action === "mp-advance") { mpAdvancePhase(); }
      else if (action === "mp-submit-abatement") { mpSubmitAbatement(); }
      else if (action === "mp-submit-order") { mpSubmitOrder(); }
      else if (action === "mp-leave") { mpReset(); G.screen = "landing"; render(); }
      else if (action === "goto-facilitator") { facReset(); G.screen = "facilitator"; render(); }
      else if (action === "fac-create") {
        var facLabelEl2 = document.getElementById("fac-label-input");
        var facRoomCountEl2 = document.getElementById("fac-roomcount-input");
        if (facLabelEl2) FAC.createDraft.label = facLabelEl2.value;
        if (facRoomCountEl2) FAC.createDraft.roomCount = parseInt(facRoomCountEl2.value, 10) || 1;
        facCreateCohort();
      }
      else if (action === "fac-reconnect") {
        var facCodeEl2 = document.getElementById("fac-code-input");
        var facTokenEl2 = document.getElementById("fac-token-input");
        if (facCodeEl2) FAC.reconnectDraft.code = facCodeEl2.value;
        if (facTokenEl2) FAC.reconnectDraft.token = facTokenEl2.value;
        facReconnect();
      }
      else if (action === "fac-rejoin-last") { facRejoinLast(); }
      else if (action === "fac-start-all") { facStartAll(); }
      else if (action === "fac-advance-all") { facAdvanceAll(); }
      else if (action === "fac-advance-one") { facAdvanceOne(el.getAttribute("data-id")); }
      else if (action === "fac-cbam-toggle") {
        var facCurCbam = (FAC.rooms[0] && FAC.rooms[0].state && FAC.rooms[0].state.cbamConfig) || { enabled: false, article9Recognized: false };
        facSetCbamConfigAll(el.getAttribute("data-id") === "on", facCurCbam.article9Recognized);
      }
      else if (action === "fac-cbam-article9-toggle") {
        var facCurCbam2 = (FAC.rooms[0] && FAC.rooms[0].state && FAC.rooms[0].state.cbamConfig) || { enabled: false, article9Recognized: false };
        facSetCbamConfigAll(facCurCbam2.enabled, el.getAttribute("data-id") === "on");
      }
      else if (action === "fac-leave") { facReset(); G.screen = "landing"; render(); }
    };
    var slider = document.getElementById("abate-slider");
    if (slider) {
      slider.oninput = function () {
        G.abateDraft = parseInt(slider.value, 10);
        var p = player();
        var sec = sectorById(p.sectorId);
        var target = targetIntensity(p, sec, G.year);
        var effCount = previewEffectiveCount(p, G.abateDraft, G.year);
        var reduced = cumulativeReduction(p, effCount);
        var actual = p.baselineIntensity - reduced;
        var capex = newMeasuresCost(p, p.activatedCount, G.abateDraft);
        document.getElementById("abate-capex").textContent = capexLabel(capex);
        var intensityEl = document.getElementById("abate-intensity");
        intensityEl.textContent = num2.format(actual);
        intensityEl.style.color = actual <= target ? "var(--good)" : "var(--critical)";
        document.getElementById("measure-list").innerHTML = measureRows(p, G.abateDraft, G.year);
        refreshCbamPreview();
      };
    }
    var prodSlider = document.getElementById("production-slider");
    if (prodSlider) {
      prodSlider.oninput = function () {
        G.productionDraft = parseInt(prodSlider.value, 10) / 100;
        var p = player();
        var sec = sectorById(p.sectorId);
        var yd = ensureYearData();
        var stats = previewProductionStats(p, sec, G.productionDraft, yd.scenario);
        document.getElementById("production-level").textContent = Math.round(G.productionDraft * 100) + "%";
        document.getElementById("production-output").textContent = moneyInt.format(Math.round(stats.actualOutput));
        var revEl = document.getElementById("production-revenue");
        revEl.textContent = cr(stats.revenue);
        revEl.style.color = stats.oversupplied ? "var(--warning)" : "var(--ink)";
        document.getElementById("production-note").textContent = stats.oversupplied
          ? "Producing above the demand ceiling (" + moneyInt.format(Math.round(stats.ceiling)) + ") — the excess sells at a discount."
          : "Within this year's demand ceiling (" + moneyInt.format(Math.round(stats.ceiling)) + ") — full-price revenue on all of it.";
        refreshCbamPreview();
      };
    }
    var cbamShareSlider = document.getElementById("cbam-share-slider");
    if (cbamShareSlider) {
      cbamShareSlider.oninput = function () {
        G.cbamDraft.euShare = parseInt(cbamShareSlider.value, 10) / 100;
        refreshCbamPreview();
      };
    }
    var cbamVerifyCheck = document.getElementById("cbam-verify-check");
    if (cbamVerifyCheck) {
      cbamVerifyCheck.onchange = function () {
        G.cbamDraft.verify = cbamVerifyCheck.checked;
        refreshCbamPreview();
      };
    }
    var qtyEl = document.getElementById("trade-qty");
    var priceEl = document.getElementById("trade-price");
    if (qtyEl) qtyEl.oninput = function () { G.tradeDraft.qty = parseFloat(qtyEl.value) || 0; };
    if (priceEl) priceEl.oninput = function () { G.tradeDraft.limitPrice = parseFloat(priceEl.value) || PRICE_FLOOR; };

    var firmsEl = document.getElementById("sim-firms");
    if (firmsEl) {
      firmsEl.oninput = function () {
        G.simConfig.firmsPerSector = parseInt(firmsEl.value, 10);
        document.getElementById("sim-firms-val").textContent = G.simConfig.firmsPerSector;
        document.getElementById("sim-total-operators").textContent = moneyInt.format(G.simConfig.firmsPerSector * SECTORS.length) + " operators simulated per trial, across all 9 sectors.";
      };
    }
    var trialsEl = document.getElementById("sim-trials");
    if (trialsEl) {
      trialsEl.oninput = function () {
        G.simConfig.trials = parseInt(trialsEl.value, 10);
        document.getElementById("sim-trials-val").textContent = G.simConfig.trials;
      };
    }
    var weightEls = document.querySelectorAll(".sim-weight");
    weightEls.forEach(function (el) {
      el.oninput = function () {
        var kind = el.getAttribute("data-kind");
        var idx = parseInt(el.getAttribute("data-idx"), 10);
        var weights = kind === "arche" ? G.simConfig.archetypeWeights : G.simConfig.strategyWeights;
        weights[idx] = parseInt(el.value, 10);
        weights.forEach(function (w, i) {
          var span = document.getElementById(kind + "-pct-" + i);
          if (span) span.textContent = Math.round(weightPct(weights, i)) + "%";
        });
      };
    });

    var mpCodeEl = document.getElementById("mp-code-input");
    if (mpCodeEl) mpCodeEl.oninput = function () { MP.joinDraft.code = mpCodeEl.value.toUpperCase(); };
    var mpNameEl = document.getElementById("mp-name-input");
    if (mpNameEl) mpNameEl.oninput = function () { MP.seatDraft.name = mpNameEl.value; };

    var mpAbateSlider = document.getElementById("mp-abate-slider");
    if (mpAbateSlider) {
      mpAbateSlider.oninput = function () {
        MP.abateDraft = parseInt(mpAbateSlider.value, 10);
        var mine = mpMyCompany();
        var sector = sectorById(mine.sectorId);
        var target = targetIntensity(mine, sector, MP.state.year);
        var effCount = previewEffectiveCount(mine, MP.abateDraft, MP.state.year);
        var reduced = cumulativeReduction(mine, effCount);
        var actual = mine.baselineIntensity - reduced;
        var capex = newMeasuresCost(mine, mine.activatedCount, MP.abateDraft);
        document.getElementById("mp-abate-capex").textContent = capexLabel(capex);
        var intensityEl = document.getElementById("mp-abate-intensity");
        intensityEl.textContent = num2.format(actual);
        intensityEl.style.color = actual <= target ? "var(--good)" : "var(--critical)";
        document.getElementById("mp-measure-list").innerHTML = measureRows(mine, MP.abateDraft, MP.state.year);
        refreshMpCbamPreview();
      };
    }
    var mpProdSlider = document.getElementById("mp-production-slider");
    if (mpProdSlider) {
      mpProdSlider.oninput = function () {
        MP.productionDraft = parseInt(mpProdSlider.value, 10) / 100;
        var mine = mpMyCompany();
        var sector = sectorById(mine.sectorId);
        var yd = MP.state.yearData[MP.state.year] || {};
        if (!yd.scenario) return;
        var stats = previewProductionStats(mine, sector, MP.productionDraft, yd.scenario);
        document.getElementById("mp-production-level").textContent = Math.round(MP.productionDraft * 100) + "%";
        document.getElementById("mp-production-output").textContent = moneyInt.format(Math.round(stats.actualOutput));
        var revEl = document.getElementById("mp-production-revenue");
        revEl.textContent = cr(stats.revenue);
        revEl.style.color = stats.oversupplied ? "var(--warning)" : "var(--ink)";
        document.getElementById("mp-production-note").textContent = stats.oversupplied
          ? "Producing above the demand ceiling (" + moneyInt.format(Math.round(stats.ceiling)) + ") — the excess sells at a discount."
          : "Within this year's demand ceiling (" + moneyInt.format(Math.round(stats.ceiling)) + ") — full-price revenue on all of it.";
        refreshMpCbamPreview();
      };
    }
    var mpCbamShareSlider = document.getElementById("mp-cbam-share-slider");
    if (mpCbamShareSlider) {
      mpCbamShareSlider.oninput = function () {
        MP.cbamDraft.euShare = parseInt(mpCbamShareSlider.value, 10) / 100;
        refreshMpCbamPreview();
      };
    }
    var mpCbamVerifyCheck = document.getElementById("mp-cbam-verify-check");
    if (mpCbamVerifyCheck) {
      mpCbamVerifyCheck.onchange = function () {
        MP.cbamDraft.verify = mpCbamVerifyCheck.checked;
        refreshMpCbamPreview();
      };
    }
    var mpQtyEl = document.getElementById("mp-trade-qty");
    var mpPriceEl = document.getElementById("mp-trade-price");
    if (mpQtyEl) mpQtyEl.oninput = function () { MP.tradeDraft.qty = parseFloat(mpQtyEl.value) || 0; };
    if (mpPriceEl) mpPriceEl.oninput = function () { MP.tradeDraft.limitPrice = parseFloat(mpPriceEl.value) || PRICE_FLOOR; };

    var facLabelEl = document.getElementById("fac-label-input");
    if (facLabelEl) facLabelEl.oninput = function () { FAC.createDraft.label = facLabelEl.value; };
    var facRoomCountEl = document.getElementById("fac-roomcount-input");
    if (facRoomCountEl) facRoomCountEl.oninput = function () { FAC.createDraft.roomCount = parseInt(facRoomCountEl.value, 10) || 1; };
    var facCodeEl = document.getElementById("fac-code-input");
    if (facCodeEl) facCodeEl.oninput = function () { FAC.reconnectDraft.code = facCodeEl.value.toUpperCase(); };
    var facTokenEl = document.getElementById("fac-token-input");
    if (facTokenEl) facTokenEl.oninput = function () { FAC.reconnectDraft.token = facTokenEl.value; };
  }

  render();
})();
</script>
